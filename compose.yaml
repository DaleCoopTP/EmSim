name: emsim

# "demo" profile (RFC-001 §4.3): everything on one machine, one worker
# process running every pool (short/llm/stt/caller) plus maintenance
# (reaper + sampler) via --role=all — unlike orchestration-core's compose,
# which ran a separate container per Kind/role, this port has one worker
# process by design (ADR-001). stt/caddy are still added once those
# inference clients exist.
#
# ADR-029: the local model ships as the "llm" service (llama-server with a
# GGUF from ./models, fetched once by `make model`), and the worker's AI
# caller (caller.reply, ADR-025) and description judge (assessment.
# evaluate's DESCRIPTION_CONTENT, ADR-028) use it by default. Without the
# model file the llm service never becomes healthy and the worker does not
# start — run with `-f compose.yaml -f compose.no-llm.yaml` instead (stub
# caller and no judge by default, or Ollama on the host; see that file and
# README.md). Capacity numbers below (LLM_PARALLEL, CALLER_CONCURRENCY,
# CALLER_REPLY_TIMEOUT) are pre-measurement defaults; `emsim bench-llm` on
# the target server decides them (slice-112-5b-plan.md, stage 2).

x-database-url: &database-url postgres://emsim:${POSTGRES_PASSWORD:-local-only-postgres-password}@postgres:5432/emsim?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: emsim
      POSTGRES_USER: emsim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-postgres-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emsim -d emsim"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  migrate:
    image: emsim:local
    build:
      context: .
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: creates the initial admin account (slice-planning.md §2)
  # when the installation has none yet. Idempotent — safe to run on every
  # "docker compose up".
  bootstrap:
    image: emsim:local
    command: ["bootstrap-admin"]
    environment:
      DATABASE_URL: *database-url
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-local-only-admin-password}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # One-shot: loads the pilot catalogue (seed/, slice-planning.md §3's C3
  # — three services, one classifier type, two prepared scenarios) after
  # the initial admin exists, since import's --actor must name an active
  # admin. Idempotent (internal/content.Service.ImportScenarios' own
  # replay rules) — safe on every "docker compose up", including after a
  # scenario file gains a new version.
  seed:
    image: emsim:local
    command: ["import", "seed", "--actor", "${BOOTSTRAP_ADMIN_LOGIN:-admin}", "/app/seed"]
    environment:
      DATABASE_URL: *database-url
      BLOB_ROOT: /app/blobs
    volumes:
      - blob-data:/app/blobs
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: emsim:local
    command: ["api"]
    environment:
      DATABASE_URL: *database-url
      BLOB_ROOT: /app/blobs
      API_LISTEN_ADDR: 0.0.0.0:8080
      ADMIN_LISTEN_ADDR: 0.0.0.0:8081
      # No Caddy/TLS in front in the demo profile (RFC-001 §4.3): a
      # Secure cookie would never be sent back by the browser over plain
      # HTTP, so the session would appear to silently not persist.
      COOKIE_SECURE: "false"
      # ADR-028/029: "llm" (default) freezes operator112/rubric-v3 into new
      # lessons; "off" keeps rubric-v2. Must match the worker's own
      # ASSESSMENT_JUDGE below, so a new lesson only ever freezes
      # rubric-v3 when this deployment can actually answer it.
      ASSESSMENT_JUDGE: ${ASSESSMENT_JUDGE:-llm}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${API_ADMIN_PORT:-8081}:8081"
    volumes:
      - blob-data:/app/blobs
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 2s

  worker:
    image: emsim:local
    command: ["worker", "--role=all"]
    environment:
      DATABASE_URL: *database-url
      BLOB_ROOT: /app/blobs
      WORKER_ID: compose-worker
      WORKER_POLL_INTERVAL: 250ms
      WORKER_DRAIN_TIMEOUT: 10s
      WORKER_ADMIN_LISTEN_ADDR: 0.0.0.0:8081
      SHORT_CONCURRENCY: 4
      # The judge (llm pool) and the caller (caller pool) share the llm
      # service's LLM_PARALLEL slots: keep LLM_CONCURRENCY +
      # CALLER_CONCURRENCY <= LLM_PARALLEL, or extra requests wait in the
      # server's own queue (ADR-029).
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
      STT_CONCURRENCY: 1
      REPORT_CONCURRENCY: 1
      CALLER_CONCURRENCY: ${CALLER_CONCURRENCY:-3}
      CALLER_REPLY_TIMEOUT: ${CALLER_REPLY_TIMEOUT:-30s}
      CALLER_STUB_DELAY: ${CALLER_STUB_DELAY:-1s}
      # 112-5b/ADR-025/029: "llm" (default) answers caller.reply through
      # aicaller.Replier over the llm service; "stub" is 112-5a's six fixed
      # phrases, no model dependency.
      CALLER_REPLIER: ${CALLER_REPLIER:-llm}
      CALLER_LLM_URL: ${CALLER_LLM_URL:-http://llm:8080/v1}
      CALLER_LLM_MODEL: ${CALLER_LLM_MODEL:-${LLM_MODEL_ALIAS:-t-tech/T-lite-it-2.1:q5_K_M}}
      # ADR-028/029: "llm" (default) lets assessment.evaluate ask the
      # model for DESCRIPTION_CONTENT; "off" wires no judge at all. Keep
      # it equal to the api's own ASSESSMENT_JUDGE above.
      ASSESSMENT_JUDGE: ${ASSESSMENT_JUDGE:-llm}
      JUDGE_LLM_URL: ${JUDGE_LLM_URL:-http://llm:8080/v1}
      JUDGE_LLM_MODEL: ${JUDGE_LLM_MODEL:-${LLM_MODEL_ALIAS:-t-tech/T-lite-it-2.1:q5_K_M}}
      JUDGE_TIMEOUT: ${JUDGE_TIMEOUT:-120s}
      JUDGE_MAX_TOKENS: ${JUDGE_MAX_TOKENS:-1024}
    ports:
      - "127.0.0.1:${WORKER_ADMIN_PORT:-8082}:8081"
    volumes:
      - blob-data:/app/blobs
    # host.docker.internal stays for compose.no-llm.yaml's Ollama-on-the-
    # host development mode.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - inference
    depends_on:
      migrate:
        condition: service_completed_successfully
      # required: false lets compose.no-llm.yaml switch the llm service
      # off; with the stock file the worker waits until the model is
      # loaded.
      llm:
        condition: service_healthy
        required: false
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 2s

  # ADR-029: the local model. llama-server keeps the GGUF loaded and
  # serves the OpenAI-compatible /v1/chat/completions both the caller and
  # the judge call. The image is pinned by build tag and digest; weights
  # come from ./models (read-only, never in git or the emsim image — `make
  # model`). No published port, and the only network is "inference",
  # which has no route outside (RFC-001 §9); /metrics and /slots are
  # reachable only from the worker's network, e.g. for bench-llm.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11206@sha256:00bd6c289c590e576948cb3639b8195e4d3e6dd6ba1d761f0e2b871fcd4df24f
    command:
      - --model
      - /models/${LLM_MODEL_FILE:-T-lite-it-2.1-Q5_K_M.gguf}
      - --alias
      - ${LLM_MODEL_ALIAS:-t-tech/T-lite-it-2.1:q5_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --jinja
      # Reasoning off: a caller line or a judge verdict never needs it,
      # and it would only burn CPU time (clients strip leaks anyway).
      - --reasoning-budget
      - "0"
      # Slots: requests in different slots are batched into one decoder
      # pass. The context is split between them (16384 / 4 = 4096 tokens
      # per dialogue by default) — raise LLM_CTX_SIZE with LLM_PARALLEL.
      - --parallel
      - ${LLM_PARALLEL:-4}
      - --ctx-size
      - ${LLM_CTX_SIZE:-16384}
      - --threads
      - ${LLM_THREADS:-6}
      - --metrics
    volumes:
      - ./models:/models:ro
    networks:
      - inference
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Loading several GB of weights from disk takes a while on first
      # start; failures during this window do not count.
      start_period: 300s
      start_interval: 2s

networks:
  inference:
    internal: true

volumes:
  postgres-data:
  blob-data:
