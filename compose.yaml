name: emsim

# "demo" profile (RFC-001 §4.3): everything on one machine, one worker
# process running every pool (short/llm/stt/caller) plus maintenance
# (reaper + sampler) via --role=all — unlike orchestration-core's compose,
# which ran a separate container per Kind/role, this port has one worker
# process by design (ADR-001). stt/caddy are still added once those
# inference clients exist. 112-5b/ADR-025 adds an OpenAI-compatible LLM
# client (internal/platform/llm) for caller.reply, reachable through
# CALLER_LLM_URL — by default Ollama running on the host during
# development (extra_hosts below), never a container this compose starts
# itself; a llama-server container with a chosen GGUF is
# slice-112-5b-plan.md's own stage 2, not this file's job yet.

x-database-url: &database-url postgres://emsim:${POSTGRES_PASSWORD:-local-only-postgres-password}@postgres:5432/emsim?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: emsim
      POSTGRES_USER: emsim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-postgres-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emsim -d emsim"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  migrate:
    image: emsim:local
    build:
      context: .
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: creates the initial admin account (slice-planning.md §2)
  # when the installation has none yet. Idempotent — safe to run on every
  # "docker compose up".
  bootstrap:
    image: emsim:local
    command: ["bootstrap-admin"]
    environment:
      DATABASE_URL: *database-url
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-local-only-admin-password}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # One-shot: loads the pilot catalogue (seed/, slice-planning.md §3's C3
  # — three services, one classifier type, two prepared scenarios) after
  # the initial admin exists, since import's --actor must name an active
  # admin. Idempotent (internal/content.Service.ImportScenarios' own
  # replay rules) — safe on every "docker compose up", including after a
  # scenario file gains a new version.
  seed:
    image: emsim:local
    command: ["import", "seed", "--actor", "${BOOTSTRAP_ADMIN_LOGIN:-admin}", "/app/seed"]
    environment:
      DATABASE_URL: *database-url
      BLOB_ROOT: /app/blobs
    volumes:
      - blob-data:/app/blobs
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: emsim:local
    command: ["api"]
    environment:
      DATABASE_URL: *database-url
      BLOB_ROOT: /app/blobs
      API_LISTEN_ADDR: 0.0.0.0:8080
      ADMIN_LISTEN_ADDR: 0.0.0.0:8081
      # No Caddy/TLS in front in the demo profile (RFC-001 §4.3): a
      # Secure cookie would never be sent back by the browser over plain
      # HTTP, so the session would appear to silently not persist.
      COOKIE_SECURE: "false"
      # ADR-028: unset/"off" keeps every operator112 lesson on
      # rubric-v2 (112-6's pre-ADR-028 behavior) — nothing below matters.
      # Set the SAME value as worker's own ASSESSMENT_JUDGE below so a
      # new lesson only ever freezes rubric-v3 when this deployment can
      # actually answer it.
      ASSESSMENT_JUDGE: ${ASSESSMENT_JUDGE:-off}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${API_ADMIN_PORT:-8081}:8081"
    volumes:
      - blob-data:/app/blobs
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 2s

  worker:
    image: emsim:local
    command: ["worker", "--role=all"]
    environment:
      DATABASE_URL: *database-url
      BLOB_ROOT: /app/blobs
      WORKER_ID: compose-worker
      WORKER_POLL_INTERVAL: 250ms
      WORKER_DRAIN_TIMEOUT: 10s
      WORKER_ADMIN_LISTEN_ADDR: 0.0.0.0:8081
      SHORT_CONCURRENCY: 4
      LLM_CONCURRENCY: 1
      STT_CONCURRENCY: 1
      REPORT_CONCURRENCY: 1
      CALLER_CONCURRENCY: 4
      CALLER_REPLY_TIMEOUT: 15s
      CALLER_STUB_DELAY: ${CALLER_STUB_DELAY:-1s}
      # 112-5b/ADR-025: CALLER_REPLIER unset/"stub" keeps 112-5a's own
      # behavior — no model dependency, nothing below matters. Set
      # CALLER_REPLIER=llm (and, typically, run `ollama serve` +
      # `ollama pull` on the host first — see README.md) to route
      # caller.reply through aicaller.Replier instead.
      CALLER_REPLIER: ${CALLER_REPLIER:-stub}
      CALLER_LLM_URL: ${CALLER_LLM_URL:-http://host.docker.internal:11434/v1}
      CALLER_LLM_MODEL: ${CALLER_LLM_MODEL:-t-tech/T-lite-it-2.1:q5_K_M}
      # ADR-028 (112-6 LLM-stage): unset/"off" keeps DESCRIPTION_CONTENT
      # unavailable/needs_review for every 112 lesson, exactly 112-6's
      # pre-ADR-028 behavior — nothing below matters, and no model call
      # ever happens. Set ASSESSMENT_JUDGE=llm (the same "run `ollama
      # serve`+`ollama pull` on the host first" prerequisite as
      # CALLER_REPLIER=llm above — README.md) to let assessment.evaluate
      # actually call a model for it.
      ASSESSMENT_JUDGE: ${ASSESSMENT_JUDGE:-off}
      JUDGE_LLM_URL: ${JUDGE_LLM_URL:-http://host.docker.internal:11434/v1}
      JUDGE_LLM_MODEL: ${JUDGE_LLM_MODEL:-t-tech/T-lite-it-2.1:q5_K_M}
      JUDGE_TIMEOUT: ${JUDGE_TIMEOUT:-120s}
      JUDGE_MAX_TOKENS: ${JUDGE_MAX_TOKENS:-1024}
    ports:
      - "127.0.0.1:${WORKER_ADMIN_PORT:-8082}:8081"
    volumes:
      - blob-data:/app/blobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 2s

volumes:
  postgres-data:
  blob-data:
