openapi: 3.1.0
info:
  title: EmSim API
  version: 1.0.0-draft
  description: |
    REST/JSON API тренажёра диспетчера ДДС (RFC-001 §5).
    Аутентификация — cookie `emsim_session` (ADR-008). Все ответы несут `X-Request-ID`
    и `Cache-Control: no-store`. Ошибки — единый конверт `Error`.
    Push — Server-Sent Events (ADR-007): `/my/stream`, `/lessons/{lessonId}/stream`; формат событий — `sse-events.schema.json`.
servers:
  - url: /api/v1

tags:
  - name: auth
  - name: admin
  - name: content
  - name: lessons
  - name: trainee
  - name: assessment
  - name: reports
  - name: tasks

security:
  - cookie: []

paths:
  # ------------------------------------------------------------ auth
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Вход по логину и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 256 }
                workstation_no: { type: integer, minimum: 1, description: 'Номер РМ. Обязателен для обучаемого (иначе 422, details.field=workstation_no); для admin/instructor игнорируется. Привязка РМ к IP-адресу не реализована в этом срезе (slice-planning.md §2).' }
      responses:
        '200':
          description: Сессия создана; cookie emsim_session установлена (ADR-008)
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: workstation_no отсутствует, неизвестен или соответствующее РМ неактивно — details.field=workstation_no, details.reason=required|unknown|inactive
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Завершить сессию
      description: Возвращает 204 и сбрасывает cookie без сессии, с некорректной или уже недействительной сессией — logout идемпотентен и не раскрывает, была ли сессия действительной. Ошибка хранилища/аудита возвращает 500 и не сбрасывает cookie, чтобы клиент не получил ложное подтверждение отзыва сессии.
      responses:
        '204': { description: Сессия удалена (или отсутствовала) }
        '500': { $ref: '#/components/responses/Internal' }
  /me:
    get:
      tags: [auth]
      summary: Текущий пользователь, роль, РМ
      responses:
        '200':
          description: OK; emsim_session переустановлена с актуальным серверным expires_at для sliding-session
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------ admin
  /admin/users:
    get:
      tags: [admin]
      summary: Список пользователей
      description: Отсортирован по login.
      parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/User' } }, total: { type: integer } } } } } }
    post:
      tags: [admin]
      summary: Создать пользователя
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserCreate' } } } }
      responses:
        '201': { description: Создан, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/users/{userId}:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    patch:
      tags: [admin]
      summary: Изменить пользователя (ФИО, роль, служба, активность, пароль)
      description: Частичное обновление — поле, отсутствующее в теле, не меняется. service_code:null очищает поле; обучаемый 112 может быть без службы, а назначение ДДС требует совпадающий профиль. Для admin/instructor код службы запрещён. Смена пароля или active:false отзывает все сессии пользователя.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Правка сделала бы активного admin нулём (нельзя понизить или деактивировать последнего), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/workstations:
    get:
      tags: [admin]
      summary: Рабочие места
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Workstation' } } } } }
    put:
      tags: [admin]
      summary: Заменить список рабочих мест
      description: Не удаляет строки. Каждое РМ из тела — upsert по number (id и active игнорируются на входе, РМ активируется); РМ, чей number не встретился в теле, деактивируется, а не удаляется. Дубликат number в теле — 422.
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Workstation' } } } } }
      responses:
        '200': { description: Актуальный список РМ после замены (включая деактивированные), content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Workstation' } } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /admin/import/classifier:
    post:
      tags: [admin]
      summary: Импорт классификатора (XLSX) — фоновая задача
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
  /admin/import/tickets:
    post:
      tags: [admin]
      summary: Импорт билетов (zip/docx/txt) — фоновая задача
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
  /admin/backup:
    post:
      tags: [admin]
      summary: Сделать резервную копию сейчас (pg_dump + blobs) — фоновая задача backup.run (ADR-033)
      description: Копия пишется worker'ом в BACKUP_DIR. 409 с details.reason=backup_not_configured, пока ни один worker не сообщил о каталоге копий; backup_in_progress, пока другая копия в очереди или выполняется.
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/status:
    get:
      tags: [admin]
      summary: Состояние системы (ADR-033)
      description: Только администратор. Задачи показываются без payload/result — администратор не видит содержимого занятий.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------ content
  /services:
    get:
      tags: [content]
      summary: Справочник служб и их workflow
      description: Роли — admin и instructor (authz.GroupServices). Администратору доступ к справочнику нужен для выбора service_code обучаемого (/admin/users); доступ к содержимому сценариев/эталонов он при этом не получает.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Service' } } } } }
  /scenarios:
    get:
      tags: [content]
      summary: Список сценариев
      description: Роль — instructor (authz.GroupContent).
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - { name: exercise_type, in: query, schema: { $ref: '#/components/schemas/ExerciseType' } }
        - { name: status, in: query, description: 'Без параметра архивные сценарии не возвращаются (ADR-030); status=archived показывает только их.', schema: { type: string, enum: [draft, approved, archived] } }
        - { name: difficulty_min, in: query, schema: { type: integer, minimum: 1, maximum: 10 } }
        - { name: difficulty_max, in: query, schema: { type: integer, minimum: 1, maximum: 10 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ScenarioSummary' } }, total: { type: integer } } } } } }
    post:
      tags: [content]
      summary: Создать (или скопировать) сценарий 112 — версия 1, draft
      description: 'Срез 112-7/ADR-027, только operator112_intake full_case+free_text. copy_from_version_id копирует любую версию (свою, чужую approved, или файловый сид) с тем же mode/caller_mode в новый черновик под своим авторством; иначе — 422 unsupported_for_editor. Для ДДС остаётся не реализовано (срез 11); значение exercise_type=dds_processing отвечает 404.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScenarioCreate' } } } }
      responses:
        '201': { description: Создан, content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /intake112/catalog:
    get:
      tags: [content]
      summary: Каталог 112 для редактора (типы, профильные карты, службы, service_rules)
      description: 'Срез 112-7. Роль — instructor. То же содержимое, из которого intake_state обучаемого уже строится (internal/content/postgres.IntakeCatalog) — не секрет, здесь только собрано в одном ответе ради редактора.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Intake112Catalog' } } } }
  /scenarios/generate:
    post:
      tags: [content]
      summary: Сгенерировать сценарии локальной LLM — фоновые задачи
      description: Не реализовано до среза 11 (генерация сценариев); маршрут не зарегистрирован и отвечает 404 до этого среза.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, difficulty, count]
              properties:
                service: { type: string }
                categories: { type: array, items: { type: string }, description: коды типов классификатора или групп }
                difficulty: { type: integer, minimum: 1, maximum: 10 }
                count: { type: integer, minimum: 1, maximum: 20 }
                ticket_ids: { type: array, items: { type: string, format: uuid } }
                with_events: { type: boolean, default: true }
      responses:
        '202': { description: Задачи поставлены, content: { application/json: { schema: { type: object, properties: { task_ids: { type: array, items: { type: string, format: uuid } } } } } } }
  /scenarios/{scenarioId}:
    parameters: [ { $ref: '#/components/parameters/ScenarioId' } ]
    get:
      tags: [content]
      summary: Сценарий с текущей версией (эталон виден только преподавателю)
      description: Роль — instructor. Возвращает текущую approved-версию (тело, version_id, digest); при её отсутствии (только draft — не бывает в срезе 2, т.к. импорт сразу утверждает) — 404.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [content]
      summary: Правка черновика 112 — всегда новой draft-версией
      description: 'Срез 112-7/ADR-027, только operator112_intake full_case+free_text владельца. base_version_id и base_digest — версия, прочитанная клиентом; несовпадение любого с последней версией → 409 stale_draft (одновременные PUT сериализуются блокировкой сценария). Каждый PUT создаёт версию N+1 (draft) и переводит прежнюю latest-версию в superseded — без правки на месте (упрощение ADR-027: content не должен знать, ссылается ли training на черновик через предпросмотр). Ответ несёт issues[] (все, включая warning) — сохранение с error-issues разрешено, это просто незаконченный черновик. Для ДДС и для чужого/утверждённого без своего черновика остаётся не реализовано.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScenarioEdit' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScenarioEditResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [content]
      summary: Архивировать (не удаляет версии, на которые ссылаются карточки)
      description: Не реализовано в срезе 2; маршрут не зарегистрирован и отвечает 404 до среза 11.
      responses:
        '204': { description: Архивирован }
  /scenarios/{scenarioId}/versions:
    parameters: [ { $ref: '#/components/parameters/ScenarioId' } ]
    get:
      tags: [content]
      summary: Версии сценария
      description: Роль — instructor. Метаданные всех версий (id, version, status, digest, атрибуция утверждения); полное тело исторической (superseded) версии этот endpoint не отдаёт.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ScenarioVersionSummary' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /scenarios/{scenarioId}/validate:
    parameters: [ { $ref: '#/components/parameters/ScenarioId' } ]
    post:
      tags: [content]
      summary: Проверить черновик без сохранения
      description: Срез 112-7/ADR-027. Роль — instructor, только владелец черновика (иначе 404). Тело — то же, что уйдёт в PUT; ответ — полный список issues[], включая warning, без записи.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScenarioBody' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [issues], properties: { issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /scenarios/{scenarioId}/probe:
    parameters: [ { $ref: '#/components/parameters/ScenarioId' } ]
    post:
      tags: [content]
      summary: Тестер фраз — какие факты открывает пробная реплика
      description: Срез 112-7/ADR-027. Прогоняет текст через тот же детерминированный классификатор, что internal/training/operator112/aicaller использует при сборке промпта модели — без обращения к модели. body — как в /validate, ещё не сохранённое состояние формы (тестер фраз работает с тем, что редактируется прямо сейчас, а не с последним сохранённым черновиком). Роль — instructor, только владелец черновика.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text, body], properties: { text: { type: string, maxLength: 2000 }, body: { $ref: '#/components/schemas/ScenarioBody' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [opened], properties: { opened: { type: array, items: { type: object, required: [fact_id, kind], properties: { fact_id: { type: string }, kind: { type: string, enum: [reveal, ask] } } } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /scenarios/{scenarioId}/preview-runs:
    parameters: [ { $ref: '#/components/parameters/ScenarioId' } ]
    post:
      tags: [content]
      summary: Пройти черновик самому — одноразовое занятие mode=preview
      description: 'Срез 112-7/ADR-027. Роль — instructor, только владелец версии; version_id должен принадлежать этому сценарию и не иметь ни одного error-issue (422 has_blocking_issues иначе). Останавливает уже активный preview-прогон этого же автора, затем создаёт lessons(mode=preview)/assignments(без РМ)/run/item на самого автора и запускает его — тот же item, что и обычный обучаемый использует (POST /items/{id}/actions, GET /items/{id}). Оценивается rubric-v2, но не входит в отчёты/историю/прогресс. Завершение — обычный POST /lessons/{id}/stop.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version_id], properties: { version_id: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: Создан, content: { application/json: { schema: { type: object, required: [lesson_id, item_id], properties: { lesson_id: { type: string, format: uuid }, item_id: { type: string, format: uuid } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /scenarios/{scenarioId}/regenerate:
    parameters: [ { $ref: '#/components/parameters/ScenarioId' } ]
    post:
      tags: [content]
      summary: Перегенерировать по комментарию преподавателя — фоновая задача
      description: Не реализовано до среза 11; маршрут не зарегистрирован и отвечает 404 до этого среза.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [comment], properties: { comment: { type: string, maxLength: 2000 }, keep: { type: array, items: { type: string, enum: [card, events, reference] } } } } } } }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
  /scenarios/{scenarioId}/approve:
    parameters: [ { $ref: '#/components/parameters/ScenarioId' } ]
    post:
      tags: [content]
      summary: Утвердить черновик 112 (без озвучки — 112 не использует voice_assets)
      description: 'Срез 112-7/ADR-027, только operator112_intake full_case+free_text владельца, без error-issues (422 has_blocking_issues иначе). base_digest — как в PUT (409 stale_draft на несовпадение). Переводит прежнюю approved-версию сценария в superseded и черновик — в approved, в одной транзакции. Для ДДС остаётся не реализовано (срез 11), задача озвучки для 112 не ставится (у 112 нет voice_assets/Piper-пути).'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version_id, base_digest], properties: { version_id: { type: string, format: uuid }, base_digest: { type: string } } } } } }
      responses:
        '200': { description: Утверждено, content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /scenarios/{scenarioId}/preview:
    parameters: [ { $ref: '#/components/parameters/ScenarioId' } ]
    get:
      tags: [content]
      summary: Как увидит карточку обучаемый (без эталона) + эталон отдельно
      description: Роль — instructor. Для ДДС возвращает card и reference; для 112 — intake112 с подготовленными репликами и эталоном. Обучаемый не имеет доступа к этому маршруту.
      responses:
        '200': { description: OK, content: { application/json: { schema: { oneOf: [ { type: object, required: [card, reference], properties: { card: { $ref: '#/components/schemas/CardPreview' }, reference: { $ref: '#/components/schemas/ScenarioReference' } } }, { type: object, required: [exercise_type, intake112], properties: { exercise_type: { type: string, const: operator112_intake }, intake112: { $ref: '#/components/schemas/Intake112Scenario' } } } ] } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ lessons (instructor)
  /lessons:
    get:
      tags: [lessons]
      summary: Занятия преподавателя
      parameters: [ { name: state, in: query, schema: { type: string, enum: [draft, running, stopped, finished] } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Lesson' } } } } }
    post:
      tags: [lessons]
      summary: Создать занятие (draft)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LessonCreate' } } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Lesson' } } } }
  /lessons/options:
    get:
      tags: [lessons]
      summary: 'Справочник для назначения (срез 3): активные обучаемые и рабочие места'
      description: Только активные пользователи с ролью trainee и активные рабочие места. Не раскрывает содержимое сценариев — для этого используется GET /scenarios.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LessonOptions' } } } }
  /lessons/{lessonId}:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    get:
      tags: [lessons]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Lesson' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /lessons/{lessonId}/assignments:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    put:
      tags: [lessons]
      summary: Назначить сценарии на рабочие места (галочки)
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } } }
      responses:
        '200': { description: OK }
        '409': { description: Занятие уже запущено, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /lessons/{lessonId}/start:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    post:
      tags: [lessons]
      summary: Старт; фиксирует timing и rubric_version; предлагает первые карточки
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Lesson' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /lessons/{lessonId}/stop:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    post:
      tags: [lessons]
      summary: Стоп; барьер для поздних команд; закрытие карточек — фоновая задача
      description: Под барьером фиксирует stopped_at, epoch и cutoff открытых карточек; worker завершает их фоново.
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        '200': { description: 'OK; повтор на уже stopped/finished лекции возвращает тот же снимок без нового epoch/задачи', content: { application/json: { schema: { $ref: '#/components/schemas/Lesson' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /lessons/{lessonId}/monitor:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    get:
      tags: [lessons]
      summary: Снапшот монитора при уже открытом и буферизуемом SSE-потоке
      description: Клиент открывает stream, буферизует, затем читает этот snapshot.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Monitor' } } } }
  /lessons/{lessonId}/stream:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    get:
      tags: [lessons]
      summary: SSE-поток событий занятия (преподаватель)
      description: stream.ready → snapshot monitor → invalidations; resync повторяет процедуру.
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string }, description: Автоматический reconnect; cursor формата epoch:counter }
        - { name: cursor, in: query, schema: { type: string }, description: Сохранённый cursor для нового EventSource; при наличии заголовка приоритет у Last-Event-ID }
      responses:
        '200': { description: text/event-stream, content: { text/event-stream: { schema: { type: string } } } }
  /lessons/{lessonId}/runs/{runId}/actions:
    parameters: [ { $ref: '#/components/parameters/LessonId' }, { name: runId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [lessons]
      summary: Лента действий обучаемого (для монитора и разбора)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Action' } } } } }
  /lessons/{lessonId}/assessments:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    get:
      tags: [assessment]
      summary: Закрытые/прерванные карточки занятия для разбора (срез 6)
      description: Одна строка на закрытую или прерванную карточку занятия; automatic_state — состояние фоновой задачи по её dedup_key (null для intro). Полная детализация — GET /items/{itemId}/assessment.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LessonAssessmentRow' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ trainee
  /my/run:
    get:
      tags: [trainee]
      summary: Текущий прогон обучаемого
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyRun' } } } }
        '204': { description: Нет активного занятия }
  /my/items:
    get:
      tags: [trainee]
      summary: Список карточек в текущем прогоне (как список в АРМ-112)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ItemSummary' } } } } }
  /my/stream:
    get:
      tags: [trainee]
      summary: SSE-инвалидации обучаемого
      description: stream.ready → клиент буферизует → GET my/run, весь my/items и открытые карточки → применяет invalidations. resync повторяет процедуру; неизвестный epoch не считается восстановленной доставкой.
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string }, description: Автоматический reconnect; cursor формата epoch:counter }
        - { name: cursor, in: query, schema: { type: string }, description: Сохранённый cursor для нового EventSource; при наличии заголовка приоритет у Last-Event-ID }
      responses:
        '200': { description: text/event-stream, content: { text/event-stream: { schema: { type: string } } } }
  /my/results:
    get:
      tags: [trainee]
      summary: Результаты обучаемого по занятиям
      parameters:
        - { name: exercise_type, in: query, schema: { $ref: '#/components/schemas/ExerciseType' }, description: По умолчанию dds_processing; история и критерии разных упражнений не смешиваются. }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ItemResult' } } } } }
  /my/progress:
    get:
      tags: [trainee]
      summary: "Прогресс: уровень, средний балл, типичные ошибки, рекомендация"
      parameters:
        - { name: exercise_type, in: query, schema: { $ref: '#/components/schemas/ExerciseType' }, description: По умолчанию dds_processing; агрегат относится только к выбранному упражнению. }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Progress' } } } }
  /items/{itemId}:
    parameters: [ { $ref: '#/components/parameters/ItemId' } ]
    get:
      tags: [trainee]
      summary: Карточка целиком (обучаемому — без эталона; преподавателю — с ним)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /items/{itemId}/actions:
    parameters: [ { $ref: '#/components/parameters/ItemId' } ]
    post:
      tags: [trainee]
      summary: Команда обучаемого (идемпотентная, ADR-004/014)
      description: После авторизации replay проверяется до running/closed. Тело command_id неизменно. call_start/call_end, action, audit и call фиксируются атомарно; replay call_start возвращает исходный call_id. control_report разрешён после закрытия и не меняет evidence. Отказ сохраняет исходный HTTP-статус при replay.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Command' } } } }
      responses:
        '200':
          description: Исходная квитанция; outcome сохраняется, replayed=true при повторе
          content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } }
        '409':
          description: stale_seq | lesson_stopped | item_closed — Receipt; command_id_conflict — Error
          content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Receipt' }, { $ref: '#/components/schemas/Error' }] } } }
        '422':
          description: transition_not_allowed | comment_required | invalid_payload | call_required | call_in_progress | call_not_active | call_missed
          content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } }
  /items/{itemId}/calls/{callId}/recording:
    parameters: [ { $ref: '#/components/parameters/ItemId' }, { name: callId, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      tags: [trainee]
      summary: Загрузить ранее объявленную в call_end запись (≤ 10 МБ)
      description: Hash, размер и MIME должны совпасть с immutable manifest. При закрытии фиксируется upload deadline. Повтор принятого файла успешен даже после срока; замена запрещена. Новый файл после срока отклоняется. STT в Slice 5 не ставится.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '204': { description: Файл принят или уже был принят; STT ставится после закрытия item }
        '409': { description: recording_conflict | recording_deadline_passed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: Слишком большой файл, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [training]
      summary: Скачать готовую запись звонка
      description: Только преподаватель-владелец занятия и только после закрытия или прерывания карточки.
      responses:
        '200': { description: Audio stream }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /items/{itemId}/contacts/{contactKey}/phrases/{phrase}:
    parameters: [ { $ref: '#/components/parameters/ItemId' }, { name: contactKey, in: path, required: true, schema: { type: string } }, { name: phrase, in: path, required: true, schema: { type: string, enum: [greeting, ack] } } ]
    get:
      tags: [trainee]
      summary: Получить подготовленную голосовую реплику контакта карточки
      responses:
        '200': { description: Audio stream }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /items/{itemId}/assessment:
    parameters: [ { $ref: '#/components/parameters/ItemId' } ]
    get:
      tags: [assessment]
      summary: Правила, итоговая оценка и история; последняя expert, иначе единственная auto
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [rubric_effective, evidence, final, revisions], properties: { automatic_state: { type: [string, 'null'], enum: [waiting, pending, leased, done, failed, dead_letter, cancelled, null], description: Состояние автоматической задачи; null для intro-прохождения. Ручная оценка доступна независимо от него }, final: { oneOf: [{ $ref: '#/components/schemas/Assessment' }, { type: 'null' }] }, revisions: { type: array, items: { $ref: '#/components/schemas/Assessment' } }, rubric_effective: { type: object, additionalProperties: true, description: Слитая рубрика этой карточки (ADR-013) — нужна и когда auto ещё не посчитана, для первой ручной оценки. }, evidence: { type: object, additionalProperties: true, description: Тело evidence.schema.json — журнал, звонки, тайминги; преподаватель разбирает карточку без отдельного запроса. } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Карточка не найдена, не его занятия или ещё не закрыта, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /items/{itemId}/assessment/revisions:
    parameters: [ { $ref: '#/components/parameters/ItemId' } ]
    post:
      tags: [assessment]
      summary: Ручное исправление преподавателя (становится итоговым)
      description: Доступно после закрытия даже без auto/input. base_revision=0 при отсутствии оценки; первая expert имеет revision=2. Под item lock проверяется база, незавершённая evaluate отменяется, новая ревизия и основание рекомендаций фиксируются атомарно. Поздняя auto запрещена.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentRevision' } } } }
      responses:
        '201': { description: Создана, content: { application/json: { schema: { $ref: '#/components/schemas/Assessment' } } } }
        '409': { description: stale_revision, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  # ------------------------------------------------------------ reports
  /lessons/{lessonId}/report:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    get:
      tags: [reports]
      summary: Отчёт по занятию (ФИО, РМ, балл, время, ошибки, уровень) + агрегаты
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LessonReport' } } } }
  /lessons/{lessonId}/report.csv:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    get:
      tags: [reports]
      summary: То же в CSV (UTF-8 BOM, `;`)
      responses:
        '200': { description: OK, content: { text/csv: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /lessons/{lessonId}/report.pdf:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    post:
      tags: [reports]
      summary: Заказать неизменяемый PDF-снимок завершённого занятия
      responses:
        '202': { description: Задача поставлена, content: { application/json: { schema: { $ref: '#/components/schemas/ReportFile' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /lessons/{lessonId}/report-files:
    parameters: [ { $ref: '#/components/parameters/LessonId' } ]
    get:
      tags: [reports]
      summary: PDF-артефакты и состояния их построения
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReportFile' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/{reportId}/download:
    parameters: [ { name: reportId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [reports]
      summary: Скачать готовый PDF отчёта
      responses:
        '200': { description: PDF stream, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userId}/progress:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    get:
      tags: [reports]
      summary: Прогресс обучаемого (преподаватель)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Progress' } } } }
  /users/{userId}/recommendation:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    get:
      tags: [assessment]
      summary: Актуальная рекомендация уровня
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
    post:
      tags: [assessment]
      summary: Применить актуальную рекомендацию (сменить уровень обучаемого)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recommendation_id, basis_version]
              properties:
                recommendation_id: { type: string, format: uuid }
                basis_version: { type: integer, minimum: 0 }
      description: Application use case блокирует users → trainee_assessment_state; проверяет id, basis_version и уровень. Порты auth/assessment атомарно меняют уровень и версию основания; иначе 409 stale_recommendation.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /groups/progress:
    get:
      tags: [reports]
      summary: Сводка по группе — распределение баллов, типичные ошибки, лидеры/отстающие
      parameters: [ { name: lesson_ids, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: false } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GroupProgress' } } } }

  # ------------------------------------------------------------ tasks
  /tasks/{taskId}:
    parameters: [ { name: taskId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [tasks]
      summary: Статус фоновой задачи
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tasks/{taskId}/retry:
    parameters: [ { name: taskId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [admin]
      summary: Продолжить failed/dead_letter задачу с тем же id (ADR-033, только администратор)
      description: Повтор запрещён для done/cancelled, для оценок с уже существующей auto/expert и для хода заявителя (caller.reply/caller.warmup) — 409 с details.reason=not_retryable. Для failed/dead_letter сохраняются id/dedup/token, бюджет увеличивается на одну попытку; при sealed input (или для задач без проверки) задача возвращается в pending, оценка с ошибкой подготовки без input — в waiting. Нового автопересчёта нет.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTaskSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: emsim_session

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    ScenarioId: { name: scenarioId, in: path, required: true, schema: { type: string, format: uuid } }
    LessonId: { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Accepted:
      description: Задача поставлена
      content: { application/json: { schema: { type: object, required: [task_id], properties: { task_id: { type: string, format: uuid } } } } }
    Unauthorized: { description: Не аутентифицирован, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Нет прав или чужой ресурс, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Не найдено, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Конфликт состояния, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Validation: { description: Ошибка валидации, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited: { description: Слишком много попыток, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Internal: { description: Внутренняя ошибка, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, validation_failed, unauthorized, forbidden, not_found, conflict, rate_limited, payload_too_large, unsupported_media_type, lesson_stopped, item_closed, stale_seq, transition_not_allowed, comment_required, call_required, call_in_progress, call_not_active, call_missed, internal_error, command_id_conflict, recording_conflict, recording_deadline_passed, stale_revision, stale_recommendation, stale_draft, has_blocking_issues, unsupported_for_editor]
            message: { type: string }
            details: { type: object, additionalProperties: true }
        request_id: { type: string }

    Role: { type: string, enum: [admin, instructor, trainee] }
    Level: { type: string, enum: [easy, medium, hard] }
    ReactionStatus:
      type: string
      enum: [added, received, accepted, not_accepted, responding, arrived, working, completed, refused, completed_without_team]

    Me:
      type: object
      required: [user, session_expires_at]
      properties:
        user: { $ref: '#/components/schemas/User' }
        workstation: { $ref: '#/components/schemas/Workstation', nullable: true, description: Отсутствует у admin/instructor и у обучаемого без активного РМ в сессии }
        session_expires_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, login, full_name, role, level, active]
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        service_code: { type: string, nullable: true }
        level: { $ref: '#/components/schemas/Level', description: 'Текущий уровень обучаемого. Новый пользователь всегда easy; меняется только применением рекомендации преподавателем (срез 10), не через admin API.' }
        active: { type: boolean }
    UserCreate:
      type: object
      required: [login, password, full_name, role]
      properties:
        login: { type: string, pattern: '^[a-z0-9._-]{3,64}$' }
        password: { type: string, minLength: 8, maxLength: 256 }
        full_name: { type: string, maxLength: 200 }
        role: { $ref: '#/components/schemas/Role' }
        service_code: { type: string }
    UserPatch:
      type: object
      properties:
        password: { type: string, minLength: 8 }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        service_code: { type: string, nullable: true }
        active: { type: boolean }
    Workstation:
      type: object
      required: [number]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        number: { type: integer, minimum: 1 }
        label: { type: string }
        ip_address: { type: string, nullable: true }
        active: { type: boolean, default: true }

    Service:
      type: object
      required: [code, name, workflow]
      properties:
        code: { type: string }
        name: { type: string }
        workflow:
          type: object
          description: Переходы и правила службы; UI и сервер читают одно и то же
          properties:
            transitions: { type: object, additionalProperties: { type: array, items: { $ref: '#/components/schemas/ReactionStatus' } } }
            comment_required: { type: array, items: { $ref: '#/components/schemas/ReactionStatus' } }
            terminal: { type: array, items: { $ref: '#/components/schemas/ReactionStatus' } }
            contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }

    Contact:
      type: object
      required: [key, label, number]
      properties:
        key: { type: string }
        label: { type: string }
        number: { type: string, description: Что набирает обучаемый }
        voice: { type: string, description: Ключ голоса (пол/интонация) }
        role:
          type: string
          enum: [crew, control_112, applicant, other]
          description: 'ADR-031: роль контакта ДДС (бригада, отдел контроля 112, заявитель, прочие); не секретна, по умолчанию other.'
        phrases:
          type: object
          description: 'ADR-031: тексты подготовленных фраз контакта (не эталон); показываются, если WAV нет.'
          properties:
            greeting: { type: string }
            ack: { type: string }

    ScenarioSummary:
      type: object
      required: [id, title, exercise_type, difficulty, status, origin, version]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        exercise_type: { $ref: '#/components/schemas/ExerciseType' }
        target_service: { type: string, description: Только ДДС; у 112 отсутствует. }
        difficulty: { type: integer, minimum: 1, maximum: 10 }
        status: { type: string, enum: [draft, approved, archived] }
        origin: { type: string, enum: [manual, ticket, generated] }
        version: { type: integer }
        source_key: { type: string, nullable: true, description: Ключ файла подготовленного сценария (scenarios.source_key); null для сценариев без файлового происхождения (редактор/генерация, срез 11). }
        has_events: { type: boolean }
        has_voice: { type: boolean, description: 'Наличие подготовленного аудио (voice_assets), не просто присутствие contacts/events. Озвучка появляется в срезе 11 — до этого поле всегда false у каталога.' }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, description: 'Срез 112-7/ADR-027. Автор не секретен для инструкторского каталога (утверждённый сценарий и так виден всем) — нужен веб-редактору, чтобы решить, показывать ли «Редактировать»/«Копировать» для конкретного сценария.' }
    Scenario:
      allOf:
        - $ref: '#/components/schemas/ScenarioSummary'
        - type: object
          required: [body]
          properties:
            body: { $ref: '#/components/schemas/ScenarioBody' }
            version_id: { type: string, format: uuid }
            digest: { type: string, description: hex sha256 }
            version_status: { type: string, enum: [draft, approved, superseded], description: 'Срез 112-7/ADR-027. Только когда GET вернул владельца собственный черновик через owner-only fallback (обычный approved-ответ его не заполняет).' }
            issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' }, description: 'Срез 112-7/ADR-027. Заполняется тем же fallback''ом, что и version_status.' }
    ScenarioEdit:
      type: object
      required: [base_version_id, base_digest, body]
      description: Срез 112-7/ADR-027 — PUT /scenarios/{id}'s тело.
      properties:
        base_version_id: { type: string, format: uuid, description: 'id версии, прочитанной клиентом перед правкой; должен совпадать с последней версией сценария, иначе 409 stale_draft. Нужен вместе с base_digest: digest покрывает только тело, а сохранение одного названия создаёт новую версию с тем же digest (уточнение 27.09.2026 по ревью).' }
        base_digest: { type: string, description: digest версии, прочитанной клиентом перед правкой. }
        title: { type: string, maxLength: 200 }
        difficulty: { type: integer, minimum: 1, maximum: 10 }
        body: { $ref: '#/components/schemas/ScenarioBody' }
    ScenarioEditResult:
      type: object
      required: [version, version_id, digest, issues]
      description: PUT /scenarios/{id}'s ответ — версия всегда на 1 больше предыдущей (ADR-027 — каждый PUT создаёт новую draft-версию, без правки на месте).
      properties:
        version: { type: integer }
        version_id: { type: string, format: uuid }
        digest: { type: string, description: hex sha256 новой версии. }
        issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
    ValidationIssue:
      type: object
      required: [path, code, severity]
      description: Срез 112-7/ADR-027 — content.ValidateDetailed's один элемент. severity=warning не блокирует предпросмотр/утверждение, error блокирует.
      properties:
        path: { type: string, description: 'JSON Pointer-подобный путь внутри body, например intake112.dialogue.facts[2].card_path.' }
        code: { type: string }
        severity: { type: string, enum: [error, warning] }
        message: { type: string }
    RubricScoringOverride:
      type: object
      description: 'ADR-013 — reference.scoring, общая форма для ДДС и 112 (ADR-026): weights/critical/disabled, id проверяются против рубрики соответствующего exercise_type/rubric_version.'
      properties:
        weights: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 100 } }
        critical: { type: array, items: { type: string } }
        disabled: { type: array, items: { type: string } }
        note: { type: string }
    ScenarioCreate:
      type: object
      required: [title, difficulty]
      description: 'Срез 112-7/ADR-027 — только operator112_intake full_case+free_text; target_service остаётся зарезервирован для ДДС (срез 11, не реализовано). Ровно одно из body/copy_from_version_id: body — тело нового черновика; copy_from_version_id — версия для копирования (своя, чужая approved или файловый сид), иначе 422 unsupported_for_editor, если её mode/caller_mode не full_case/free_text.'
      properties:
        title: { type: string, maxLength: 200 }
        target_service: { type: string, description: Только ДДС; не реализовано в этом срезе. }
        difficulty: { type: integer, minimum: 1, maximum: 10 }
        ticket_id: { type: string, format: uuid }
        body: { $ref: '#/components/schemas/ScenarioBody' }
        copy_from_version_id: { type: string, format: uuid }
    ExerciseType:
      type: string
      enum: [dds_processing, operator112_intake]
    ScenarioBody:
      type: object
      required: [exercise_type]
      properties:
        exercise_type: { $ref: '#/components/schemas/ExerciseType' }
      description: Полная дискриминированная схема — contracts/scenario.schema.json. У 112 используется intake112 вместо входящей карточки ДДС.
      additionalProperties: true
    Intake112Scenario:
      type: object
      required: [reference]
      properties:
        mode: { type: string, enum: [incoming_call, card_only, full_case], description: Отсутствие означает incoming_call для старых версий. full_case (ADR-023) объединяет диалог с заявителем и профильные карты, финал — notify_services. }
        caller_mode: { type: string, enum: [prepared, free_text], description: 'Отсутствие/"prepared" — сценарный диалог 112-2; "free_text" (112-5a/ADR-024) — окно чата с заявителем. Только у full_case. Редактор 112-7 создаёт исключительно free_text.' }
        call:
          type: object
          required: [aon, local_time, time_zone]
          properties:
            aon: { type: string }
            local_time: { type: string, description: HH:mm в сценарии; не серверное время. }
            time_zone: { type: string, const: Europe/Moscow }
            script: { type: array, items: { type: string }, description: Только утверждённые сценарии 112-1. }
        dialogue: { $ref: '#/components/schemas/Intake112Dialogue' }
        recipient_services: { type: array, items: { type: string }, minItems: 1, maxItems: 1, description: Только для incoming_call. }
        reference: { $ref: '#/components/schemas/Intake112Reference' }
    Intake112Reference:
      type: object
      description: 'Закрытый эталон — доступен только преподавателю (owner для draft), никогда обучаемому. Обязательность полей зависит от mode: incoming_call требует recipient_service+expected_card (старая форма); full_case требует expected_types/case_description/expected_services и запрещает recipient_service, expected_card — необязателен (112-6/ADR-026 "эталон отсутствует" — отсутствующий блок просто получает 0, не отдельный статус); card_only требует expected_types/case_description, запрещает recipient_service/expected_card. expected_profiles/alternatives/scoring — 112-6/ADR-026, необязательны при любом mode.'
      properties:
        recipient_service: { type: string, description: Только incoming_call. }
        expected_types: { type: array, items: { type: string }, description: card_only/full_case — коды intake-catalog.json's types. }
        case_description: { type: string, description: Закрытое описание ситуации card_only/full_case. }
        expected_services: { type: array, items: { type: string }, description: full_case — коды служб для notify_services (ADR-023) и 112-6's P_SERVICES. }
        expected_card: { $ref: '#/components/schemas/Intake112ExpectedCard', nullable: true, description: incoming_call — обязателен. full_case — необязателен, эталон 112-6's ADDRESS_FIELDS/описания/P_ADDRESS_REGION/P_APPLICANT_NAME. }
        expected_profiles:
          type: object
          description: '112-6/ADR-026. Ключ — id профильной карты (intake-catalog.json, например "104"); значение — {field_id: строка | строка[] | {"state": "unknown"}} (массив только для полей kind=multiple; {"state": "unknown"} — верный ответ «Неизвестно»). Поле, скрытое условием visible_when при эталонных ответах той же карты, в эталон не входит.'
          additionalProperties: { type: object, additionalProperties: true }
        alternatives:
          type: object
          description: '112-6/ADR-026. Ключ — путь эталона в форме "expected_card.address.street"/"expected_card.applicant_name"; значение — дополнительные допустимые формулировки поверх normalize.TokenSetEqual.'
          additionalProperties: { type: array, items: { type: string } }
        scoring: { $ref: '#/components/schemas/RubricScoringOverride', nullable: true, description: '112-6/ADR-026 — reference.scoring для operator112/rubric-v2 (те же weights/critical/disabled, что ДДС уже использует, только id из rubric.operator112.json).' }
        description_questions:
          type: array
          description: 'ADR-028 (operator112/rubric-v3) — контрольные вопросы к complaint для LLM-судьи DESCRIPTION_CONTENT. Отсутствует/пусто — блок оценивается в 0 без вызова модели.'
          items: { $ref: '#/components/schemas/Intake112DescriptionQuestion' }
    Intake112DescriptionQuestion:
      type: object
      required: [id, question]
      properties:
        id: { type: string }
        question: { type: string, description: 'Формулируется положительно, например «Указано ли …?».' }
    Intake112ExpectedCard:
      type: object
      properties:
        applicant_status: { type: string }
        applicant_name: { type: string, description: '112-6/ADR-026 — сравнивается, только если ФИО раскрыто в разговоре (P_APPLICANT_NAME).' }
        age: { type: integer }
        address: { $ref: '#/components/schemas/Intake112ReferenceAddress' }
        incident_type: { type: string }
        complaint: { type: string }
        victims_count: { type: integer }
    Intake112ReferenceAddress:
      type: object
      description: '112-6/ADR-026 — поля Intake112Address без object/landmark (по решению пользователя не оцениваются). Каждое поле необязательно: отсутствующее просто не входит в эталон ADDRESS_FIELDS (поэлементно).'
      properties:
        country: { type: string }
        region: { type: string }
        okrug: { type: string }
        district: { type: string }
        city: { type: string }
        street: { type: string }
        house: { type: string }
        building: { type: string }
        structure: { type: string }
        flat: { type: string }
        entrance: { type: string }
        floor: { type: string }
    Intake112Dialogue:
      type: object
      description: Полный сценарий; доступен только преподавателю. Обучаемому выдаются текущие вопросы и произнесённые реплики.
      required: [facts, initial, questions]
      properties:
        facts:
          type: array
          items:
            type: object
            required: [id, label, knowledge]
            properties:
              id: { type: string }
              label: { type: string }
              card_path: { type: string, description: 'Обязателен у prepared-диалогов; у free_text (112-5b) может отсутствовать — нарративный факт без поля карточки.' }
              knowledge: { type: string, enum: [initial, on_question, unknown] }
              value: { type: string }
              statement: { type: string, description: '112-5b: как заявитель сказал бы этот факт своими словами.' }
              ask_patterns: { type: array, items: { type: string }, description: '112-5b: RE2-регэкспы классификатора (implicit "(?i)"), \b запрещён.' }
              ask_exclude_patterns: { type: array, items: { type: string } }
              disclosure_patterns: { type: array, items: { type: string } }
              answer_variants:
                type: array
                items:
                  type: object
                  required: [text]
                  properties:
                    when: { type: string, description: 'RE2-регэксп по реплике оператора; пусто — без условия.' }
                    text: { type: string }
        initial: { $ref: '#/components/schemas/Intake112Utterance' }
        questions:
          type: array
          items:
            type: object
            required: [id, text, topic_id, answer]
            properties:
              id: { type: string }
              text: { type: string }
              topic_id: { type: string }
              available_after: { type: array, items: { type: string } }
              answer: { $ref: '#/components/schemas/Intake112Utterance' }
        caller:
          type: object
          required: [persona, opening]
          description: '112-5b: включает ИИ-адаптер для free_text-диалога; отсутствие — заглушка, как в 112-5a.'
          properties:
            persona: { type: string }
            opening: { $ref: '#/components/schemas/Intake112Utterance' }
    Intake112Utterance:
      type: object
      required: [id, text, reveals]
      properties:
        id: { type: string }
        text: { type: string }
        reveals: { type: array, items: { type: string } }
    Intake112QuestionOption:
      type: object
      required: [id, text, topic_id, asked]
      properties:
        id: { type: string }
        text: { type: string }
        topic_id: { type: string }
        asked: { type: boolean }
    Intake112Field:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [unanswered, known, unknown, negative] }
        value: { type: string }
      description: negative допускается только для victims_present; неизвестный ответ не равен отрицательному.
    Intake112Address:
      type: object
      required: [city, street, house, building, flat, landmark]
      properties:
        country: { $ref: '#/components/schemas/Intake112Field' }
        region: { $ref: '#/components/schemas/Intake112Field' }
        city: { $ref: '#/components/schemas/Intake112Field' }
        object: { $ref: '#/components/schemas/Intake112Field' }
        okrug: { $ref: '#/components/schemas/Intake112Field' }
        district: { $ref: '#/components/schemas/Intake112Field' }
        street: { $ref: '#/components/schemas/Intake112Field' }
        house: { $ref: '#/components/schemas/Intake112Field' }
        building: { $ref: '#/components/schemas/Intake112Field' }
        structure: { $ref: '#/components/schemas/Intake112Field' }
        flat: { $ref: '#/components/schemas/Intake112Field' }
        entrance: { $ref: '#/components/schemas/Intake112Field' }
        floor: { $ref: '#/components/schemas/Intake112Field' }
        code: { $ref: '#/components/schemas/Intake112Field' }
        landmark: { $ref: '#/components/schemas/Intake112Field' }
        descriptive: { $ref: '#/components/schemas/Intake112Field' }
    Intake112Card:
      type: object
      required: [number, aon, call_local_time, call_time_zone, applicant_name, applicant_status, age, address, incident_type, complaint, victims_present, victims_count, provided_phone]
      properties:
        number: { type: string, description: Серверный номер; неизменяем. }
        aon: { type: string, description: АОН из сценария; неизменяем. }
        call_local_time: { type: string, description: Сценарное время; неизменяем. }
        call_time_zone: { type: string, description: Сценарная зона; неизменяема. }
        applicant_name: { $ref: '#/components/schemas/Intake112Field' }
        applicant_status: { $ref: '#/components/schemas/Intake112Field' }
        age: { $ref: '#/components/schemas/Intake112Field' }
        address: { $ref: '#/components/schemas/Intake112Address' }
        incident_type: { $ref: '#/components/schemas/Intake112Field' }
        complaint: { $ref: '#/components/schemas/Intake112Field' }
        victims_present: { $ref: '#/components/schemas/Intake112Field' }
        victims_count: { $ref: '#/components/schemas/Intake112Field' }
        provided_phone: { $ref: '#/components/schemas/Intake112Field' }
        on_site_phone: { $ref: '#/components/schemas/Intake112Field' }
        channel:
          allOf: [{ $ref: '#/components/schemas/Intake112Field' }]
          description: Оператор или канал связи со слов заявителя; `phone` сохраняется как значение старых карточек.
        foreign_language: { $ref: '#/components/schemas/Intake112Field' }
        no_on_site: { $ref: '#/components/schemas/Intake112Field' }
        no_access: { $ref: '#/components/schemas/Intake112Field' }
        incident_types: { type: array, items: { type: string }, description: Упорядоченные выбранные типы для card_only; старое incident_type остаётся для incoming_call. }
        profiles:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Intake112ProfileAnswers' }
          description: Только активные карты; при удалении типа ответы временно хранятся вне итогового снимка.
    Intake112ProfileAnswers:
      type: object
      required: [definition_id, version, answers]
      properties:
        definition_id: { type: string }
        version: { type: integer, minimum: 1 }
        answers:
          type: object
          additionalProperties:
            type: object
            required: [state]
            properties:
              state: { type: string, enum: [unanswered, unknown, known] }
              value: { type: string }
              values: { type: array, items: { type: string }, uniqueItems: true }
    Intake112Catalog:
      type: object
      required: [version, types, profiles, service_rules]
      properties:
        version: { type: integer, minimum: 1 }
        types:
          type: array
          items:
            type: object
            required: [id, name, profile_ids]
            properties:
              id: { type: string }
              name: { type: string }
              profile_ids: { type: array, items: { type: string }, description: В выдаче обучаемому скрыты; определения появляются только у активных карт. }
        profiles:
          type: array
          items:
            type: object
            required: [id, version, name, fields]
            properties:
              id: { type: string }
              version: { type: integer }
              name: { type: string }
              fields:
                type: array
                items:
                  type: object
                  required: [id, label, kind]
                  properties:
                    id: { type: string }
                    label: { type: string }
                    kind: { type: string, enum: [single, multiple, text, shared] }
                    options: { type: array, items: { type: string } }
                    shared: { type: string, enum: [no_on_site, no_access] }
                    visible_when:
                      type: object
                      description: 'Поле показывается, только если поле field_id той же карты (выше по списку, kind=single|multiple) известно и его значение входит в any_of. Скрытое поле в черновике всегда unanswered.'
                      required: [field_id, any_of]
                      properties:
                        field_id: { type: string }
                        any_of: { type: array, items: { type: string }, minItems: 1 }
        service_rules:
          type: array
          description: Во время прохождения обучаемому не раскрываются; основания уже предложенных служб доступны в suggested_services.
          items:
            type: object
            required: [id, profile_id, service_code, reason]
            properties:
              id: { type: string }
              profile_id: { type: string }
              field_id: { type: string }
              equals: { type: string }
              service_code: { type: string }
              reason: { type: string }
    Intake112State:
      type: object
      required: [call_status, transcript, has_saved_draft, dispatched, notified]
      properties:
        mode: { type: string, enum: [card_only, full_case], description: Отсутствует у старых входящих вызовов. }
        finale: { type: string, enum: ['', notify], description: 'ADR-023: отсутствие/"" — прежние маршруты (dispatch_intake для incoming_call, review_service_selection→complete_profile_case для card_only); "notify" — единый notify_services для card_only/full_case, назначенных с этого среза.' }
        notified: { type: boolean, description: 'Собственный флаг завершения маршрута finale=notify, параллельный dispatched; после true черновик закрыт для правок.' }
        catalog: { $ref: '#/components/schemas/Intake112Catalog', description: Неизменяемый снимок каталога; обучаемому доступны только названия типов и определения активных карт, преподавателю — полный каталог. }
        call_status: { type: string, enum: [ringing, connected, held, ended, not_applicable] }
        inactive_profiles:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Intake112ProfileAnswers' }
          description: Только рабочее состояние для преподавателя; обучаемому не выдаётся и не входит в активный итоговый снимок evidence.
        suggested_services:
          type: array
          items:
            type: object
            required: [service_code, reasons]
            properties:
              service_code: { type: string }
              reasons: { type: array, items: { type: string } }
        service_review:
          type: object
          required: [suggested, selected, reviewed_at]
          properties:
            suggested: { type: array, items: { type: object } }
            selected: { type: array, items: { type: string } }
            reason: { type: string }
            reviewed_at: { type: string, format: date-time }
        asked_question_ids: { type: array, items: { type: string }, description: В порядке первого вопроса; повторные вопросы остаются в журнале реплик. }
        caller_mode: { type: string, enum: [prepared, free_text], description: '112-5a/ADR-024: отсутствие/"prepared" — сценарный диалог 112-2 (available_questions/ask_intake_question); "free_text" — окно чата с заявителем (send_caller_message/caller_turns) вместо него. Только у full_case.' }
        caller_turns:
          type: array
          description: '112-5a/ADR-024: журнал ходов caller_mode=free_text. Пуст у сценарного диалога.'
          items:
            type: object
            required: [turn, status, requested_at]
            properties:
              turn: { type: integer, minimum: 1 }
              operator_line_id: { type: string, description: ID реплики оператора в transcript, начавшей этот ход. }
              status: { type: string, enum: [pending, answered, cancelled, failed] }
              adapter: { type: string, description: 'Реализация CallerReplier, давшая ответ (например "stub/v1"). Заполнено только при status=answered.' }
              source: { type: string, enum: [opening, scripted, model, fallback, stub], description: '112-5b/ADR-025: как получен ответ. opening/scripted/stub — без вызова модели; model/fallback — с генерацией, см. generation. Заполнено только при status=answered.' }
              generation:
                type: object
                required: [model, prompt_version]
                description: '112-5b/ADR-025: заполнено только при source=model или source=fallback.'
                properties:
                  model: { type: string }
                  prompt_version: { type: string }
                  temperature: { type: number }
                  top_p: { type: number }
                  repeat_penalty: { type: number }
                  max_tokens: { type: integer }
              requested_at: { type: string, format: date-time }
              resolved_at: { type: string, format: date-time }
              reason: { type: string, description: Причина cancelled (held/ended/dropped) или короткая техническая причина failed. }
        transcript:
          type: array
          items:
            type: object
            required: [text, server_at]
            properties:
              id: { type: string, description: Уникальный ID произнесённой реплики. }
              source_id: { type: string, description: ID реплики или вопроса в утверждённом сценарии. }
              speaker: { type: string, enum: [caller, operator] }
              call_id: { type: string, format: uuid, description: В 112-2 равен ID карточки. }
              command_id: { type: string, format: uuid }
              question_id: { type: string }
              topic_id: { type: string }
              reveals: { type: array, items: { type: string }, description: Только факты, уже раскрытые этой репликой. }
              text: { type: string }
              server_at: { type: string, format: date-time }
        has_saved_draft: { type: boolean }
        dispatched: { type: boolean }
        selected_service: { type: string }
        answered_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
    Intake112Dispatch:
      type: object
      required: [item_id, action_id, service_code, card_snapshot, sent_at]
      properties:
        item_id: { type: string, format: uuid }
        action_id: { type: string, format: uuid }
        service_code: { type: string }
        card_snapshot: { $ref: '#/components/schemas/Intake112Card' }
        sent_at: { type: string, format: date-time }
    Intake112Notification:
      type: object
      description: 'ADR-023: единственная неизменяемая запись «оповестить и сохранить карточку» — список служб (с отметкой suggested), причина изменения списка, снимок карточки и время. Заменяет Intake112Dispatch для card_only/full_case.'
      required: [item_id, action_id, services, card_snapshot, notified_at]
      properties:
        item_id: { type: string, format: uuid }
        action_id: { type: string, format: uuid }
        services:
          type: array
          minItems: 1
          items:
            type: object
            required: [service_code, suggested]
            properties:
              service_code: { type: string }
              suggested: { type: boolean, description: Служба входила в state.suggested_services на момент оповещения. }
        reason: { type: string }
        card_snapshot: { $ref: '#/components/schemas/Intake112Card' }
        notified_at: { type: string, format: date-time }
    ScenarioVersionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          type: string
          enum:
          - draft
          - approved
          - superseded
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          nullable: true
        digest:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 10

    CardView:
      type: object
      description: |
        Карточка так, как её видит обучаемый (без эталона) — та же allowlist-проекция,
        что CardPreview (internal/content.CardPreview, GET /scenarios/{id}/preview), но
        registered_at здесь абсолютное серверное время (items.offered_at +
        card.registered_at_offset_s), а не относительный сдвиг: карточка реально выдана
        обучаемому (срез 3), а не только просматривается преподавателем.
        Не содержит reference, hints, generation, events[].expects/text, field_corrections,
        pilot_goal — эти поля видны только преподавателю через Item.reference.
      required: [number, registered_at, address, incident, notification_list]
      properties:
        number: { type: string }
        registered_at: { type: string, format: date-time }
        applicant:
          type: object
          properties:
            name: { type: string }
            phone: { type: string }
            status: { type: string, enum: [witness, victim, relative, acquaintance, child, participant] }
        address: { $ref: '#/components/schemas/Address' }
        incident:
          type: object
          properties:
            type_code: { type: string }
            type_name: { type: string }
            features: { type: object, additionalProperties: { type: [string, boolean, number] } }
            description: { type: string }
            victims: { type: integer, minimum: 0 }
            danger: { type: string }
        notification_list:
          type: array
          items:
            type: object
            properties:
              service: { type: string }
              status: { $ref: '#/components/schemas/ReactionStatus' }
              mine: { type: boolean, description: Служба обучаемого }
        phones:
          type: object
          properties:
            aon: { type: string }
            provided: { type: string }
            on_site: { type: string }
        channel: { type: string }
        contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }

    Address:
      type: object
      description: Структурированный адрес карточки (scenario.schema.json $defs.card.properties.address). Поля необязательны по отдельности — заполняются те, что есть в конкретном сценарии.
      properties:
        district: { type: string }
        street: { type: string }
        house: { type: string }
        building: { type: string }
        entrance: { type: string }
        floor: { type: string }
        flat: { type: string }
        landmark: { type: string }
        text: { type: string, description: Адрес одной строкой }
        country: { type: string }
        region: { type: string }
        city: { type: string }
        okrug: { type: string }
        object: { type: string }
        structure: { type: string }
        code: { type: string }
        descriptive: { type: string }

    CardPreview:
      type: object
      description: |
        Просмотр карточки преподавателем (GET /scenarios/{id}/preview) — та же allowlist-проекция,
        что увидит обучаемый в срезе 3 (internal/content.CardPreview), плюс отсутствующее в CardView
        относительное время. Не содержит reference, hints, generation, events[].expects/text,
        field_corrections, pilot_goal — эти поля преподаватель видит отдельно в ScenarioReference.
      required: [number, registered_at_offset_s, address, incident, notification_list]
      properties:
        number: { type: string }
        registered_at_offset_s: { type: integer, description: Секунды регистрации в 112 относительно момента выдачи карточки (card.registered_at_offset_s); обычно отрицательное. Абсолютное время появляется только при реальной выдаче в срезе 3. }
        applicant:
          type: object
          properties:
            name: { type: string }
            phone: { type: string }
            status: { type: string, enum: [witness, victim, relative, acquaintance, child, participant] }
        address: { $ref: '#/components/schemas/Address' }
        incident:
          type: object
          properties:
            type_code: { type: string }
            type_name: { type: string }
            features: { type: object, additionalProperties: { type: [string, boolean, number] } }
            description: { type: string }
            victims: { type: integer, minimum: 0 }
            danger: { type: string }
        notification_list:
          type: array
          items:
            type: object
            properties:
              service: { type: string }
              status: { $ref: '#/components/schemas/ReactionStatus' }
              mine: { type: boolean, description: Служба обучаемого }
        phones:
          type: object
          properties:
            aon: { type: string }
            provided: { type: string }
            on_site: { type: string }
        channel: { type: string }
        contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }

    ScenarioReference:
      type: object
      description: Эталон сценария — то, с чем сравнивает оценка (scenario.schema.json $defs.reference). Обучаемому никогда не отдаётся; здесь — только для просмотра преподавателем.
      required: [primary_decision, expected_chain, call]
      properties:
        primary_decision:
          type: object
          properties:
            status: { type: string, enum: [accepted, not_accepted, completed_without_team] }
            reason_tags: { type: array, items: { type: string } }
            comment_required: { type: boolean }
            comment_must_mention: { type: array, items: { type: string } }
        expected_chain: { type: array, items: { $ref: '#/components/schemas/ReactionStatus' } }
        call:
          type: object
          properties:
            required: { type: boolean }
            to: { type: string, description: contact.key }
            must_mention: { type: array, items: { type: string } }
            before_status: { $ref: '#/components/schemas/ReactionStatus' }
        field_corrections:
          type: array
          description: 'Пилотное расширение слайса 2 (RFC-001 slice-planning.md §3): поля, которые обучаемый обязан исправить до указанного статуса. Пусто, если исправлений не требуется.'
          items:
            type: object
            properties:
              path: { type: string, description: JSON Pointer на поле card, например /card/address/okrug }
              expected_value: { type: string }
              before_status: { $ref: '#/components/schemas/ReactionStatus' }
        pilot_goal: { type: string, enum: [accept_card], description: Пилотное упрощение цели прохождения; не команда закрытия. Отсутствует у сценариев с обычными правилами завершения. }
        guide_refs: { type: array, items: { type: string } }
        notes: { type: string }
        scoring: { $ref: '#/components/schemas/RubricScoringOverride', description: Поправки к рубрике по умолчанию (ADR-013); отсутствие блока = дефолт. }

    LessonCreate:
      type: object
      description: Для operator112_intake в первом срезе разрешены только mode=training, level=easy, без timing; для ДДС сохраняются прежние режимы и нормативы.
      required: [title, mode, level, exercise_type]
      properties:
        exercise_type: { $ref: '#/components/schemas/ExerciseType' }
        title: { type: string, maxLength: 200 }
        mode: { type: string, enum: [intro, training, preview], description: 'preview (срез 112-7/ADR-027) существует только для отклика на GET-эндпоинтах — POST /lessons его отклоняет; preview-занятие создаётся исключительно POST /scenarios/{id}/preview-runs.' }
        level: { $ref: '#/components/schemas/Level' }
        timing:
          type: object
          description: Только ДДС. У 112-1 нет временных нормативов; сервер возвращает нулевую политику, но не использует её для оценки.
          properties:
            open_s: { type: integer, default: 30 }
            primary_s: { type: integer, default: 30 }
            complete_s: { type: integer, default: 180 }
            spawn_every_s: { type: integer, nullable: true, description: hard — интервал новых карточек }
    Lesson:
      allOf:
      - $ref: '#/components/schemas/LessonCreate'
      - type: object
        required:
        - id
        - state
        - epoch
        properties:
          id:
            type: string
            format: uuid
          state:
            type: string
            enum:
            - draft
            - running
            - stopped
            - finished
          epoch:
            type: integer
          rubric_version:
            type: string
          assignments:
            type: array
            items:
              $ref: '#/components/schemas/Assignment'
          started_at:
            type: string
            format: date-time
            nullable: true
          stopped_at:
            type: string
            format: date-time
            nullable: true
          stop_reason:
            type: string
            maxLength: 500
          pending_assessments:
            type: integer

    Assignment:
      type: object
      required: [workstation_no, user_id, scenario_version_ids]
      properties:
        workstation_no: { type: integer }
        user_id: { type: string, format: uuid, description: 'Обязателен (срез 3, ADR-017/slice-planning.md §4): вариант "кто залогинится на РМ" (NULL) в MVP не поддерживается.' }
        scenario_version_ids: { type: array, minItems: 1, items: { type: string, format: uuid }, description: 'Упорядоченная очередь версий сценариев для пары РМ и обучаемого.' }

    LessonOptions:
      type: object
      description: 'Срез 3: справочник для конструктора назначений.'
      required: [trainees, workstations]
      properties:
        trainees:
          type: array
          items:
            type: object
            required: [id, full_name, service_code]
            properties:
              id: { type: string, format: uuid }
              full_name: { type: string }
              service_code: { type: string, nullable: true }
              service_name: { type: string, nullable: true }
        workstations:
          type: array
          items:
            type: object
            required: [id, number]
            properties:
              id: { type: string, format: uuid }
              number: { type: integer }
              label: { type: string }

    Monitor:
      type: object
      required: [lesson, rows, server_time]
      properties:
        lesson: { $ref: '#/components/schemas/Lesson' }
        server_time: { type: string, format: date-time }
        last_event_id: { type: string }
        rows:
          type: array
          items:
            type: object
            required: [workstation_no, user, run_id, online, active_items, queue_left, done]
            properties:
              workstation_no: { type: integer }
              user: { $ref: '#/components/schemas/User' }
              run_id: { type: string, format: uuid }
              online: { type: boolean }
              active_items: { type: array, items: { $ref: '#/components/schemas/ItemSummary' }, description: 'Все незавершённые карточки, ordinal ascending; hard может содержать несколько.' }
              queue_left: { type: integer }
              done: { type: integer }
              last_action: { $ref: '#/components/schemas/Action' }
              reports:
                type: array
                description: 'Только dds_processing (ADR-031): доставленные notice/phone_incoming активных карточек и фактическая реакция — первый применённый set_status после доставки (для входящего — после ответа). Эталон expects не используется.'
                items: { $ref: '#/components/schemas/MonitorReport' }

    MonitorReport:
      type: object
      required: [item_id, event_key, delivery, from, from_label, delivered_at, answered_at, missed, reaction_at]
      properties:
        item_id: { type: string, format: uuid }
        event_key: { type: string }
        delivery: { type: string, enum: [notice, phone_incoming] }
        from: { type: string, description: contact.key }
        from_label: { type: string }
        delivered_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time, description: Только phone_incoming }
        missed: { type: boolean, description: 'phone_incoming не принят за 30 с' }
        reaction_at: { type: [string, 'null'], format: date-time }

    MyRun:
      type: object
      required: [run_id, lesson, current_item_id, queue_left, exercise_type, mode, workstation_no]
      properties:
        exercise_type: { $ref: '#/components/schemas/ExerciseType' }
        run_id: { type: string, format: uuid }
        lesson: { $ref: '#/components/schemas/Lesson' }
        mode: { type: string, enum: [intro, training, preview] }
        workstation_no: { type: integer, description: РМ, на котором идёт прогон — сверяется с РМ текущей сессии обучаемого. }
        current_item_id: { type: string, format: uuid, nullable: true }
        queue_left: { type: integer }
        server_time: { type: string, format: date-time }
    ItemSummary:
      type: object
      description: exercise_type определяет вариант. Для operator112_intake call_status и dispatched описывают входящий вызов; нормативы deadlines не применяются.
      required:
      - id
      - state
      - reaction
      - seq
      - card_number
      - offered_at
      - deadlines
      - interruptions
      properties:
        exercise_type: { $ref: '#/components/schemas/ExerciseType' }
        call_status: { type: string, enum: [ringing, connected, held, ended, not_applicable] }
        dispatched: { type: boolean }
        notified: { type: boolean }
        card_status:
          type: string
          enum: [registered, not_notified, in_progress, refused, completed, not_completed]
          description: >-
            Только dds_processing (ADR-030): вычисляемый статус карточки по памятке ДДС, стр. 27–28, не хранится.
            registered — первичного статуса ещё нет, срок не истёк; not_notified — нет «Принята»/«Не принята» после
            норматива первичного статуса; in_progress — принята, идут работы; refused — not_accepted/refused;
            completed — completed/completed_without_team; not_completed — карточка прервана без завершения.
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - offered
          - opened
          - in_progress
          - closed
          - interrupted
        reaction:
          $ref: '#/components/schemas/ReactionStatus'
        seq:
          type: integer
        card_number:
          type: string
        incident_type:
          type: string
        address_short:
          type: string
        offered_at:
          type: string
          format: date-time
        opened_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        spawned_from_item_id:
          type: string
          format: uuid
          nullable: true
        close_reason:
          type: string
          enum: [completed, refused, interrupted, pilot_completed, no_contact, call_dropped]
          nullable: true
          description: 'pilot_completed — пилотное завершение из accepted (ADR-017, срез 3); не означает правильного выполнения.'
        deadlines:
          $ref: '#/components/schemas/Deadlines'
        assessment_status:
          type: string
          enum:
          - pending
          - ready
          - needs_review
          - unavailable
          nullable: true
        score:
          type: number
          nullable: true
        primary_at:
          type:
          - string
          - 'null'
          format: date-time
        interruptions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - recovery_id
            - cause
            - detected_at
            properties:
              recovery_id:
                type: string
                format: uuid
              cause:
                const: server_restart
              detected_at:
                type: string
                format: date-time

    Deadlines:
      type: object
      description: 'Серверные сроки: open/primary от offered_at, complete от первого primary_at. Не сдвигаются после сбоя; interruptions
        исключает timing из оценки.'
      properties:
        open_at:
          type: string
          format: date-time
        primary_at:
          type: string
          format: date-time
        complete_at:
          type: string
          format: date-time
          nullable: true

    Item:
      allOf:
        - $ref: '#/components/schemas/ItemSummary'
        - type: object
          required: [card, actions, events, calls, server_time, mode, allowed_transitions]
          properties:
            mode: { type: string, enum: [intro, training, preview] }
            card:
              oneOf:
                - { $ref: '#/components/schemas/CardView' }
                - { $ref: '#/components/schemas/Intake112Card' }
            intake_state: { $ref: '#/components/schemas/Intake112State' }
            available_service_codes: { type: array, items: { type: string }, description: Доступные учебные службы для ручного выбора в режиме card_only/full_case (обучаемому и преподавателю на своём предпросмотре, 112-7/ADR-027); не раскрывает условия предложений. }
            available_questions: { type: array, items: { $ref: '#/components/schemas/Intake112QuestionOption' }, description: Только вопросы, разрешённые в текущем состоянии вызова. }
            intake_dialogue_reference: { $ref: '#/components/schemas/Intake112Dialogue', description: Только преподавателю в режиме 112. }
            dispatch: { $ref: '#/components/schemas/Intake112Dispatch' }
            notification: { $ref: '#/components/schemas/Intake112Notification' }
            recipient_services: { type: array, items: { type: string }, description: Разрешённые учебные адресаты; эталон не раскрывается. }
            intake_reference: { type: object, description: Только преподавателю в режиме 112. }
            terminal_statuses:
              type: array
              items: { $ref: '#/components/schemas/ReactionStatus' }
              description: >-
                Только dds_processing (ADR-030): финальные статусы из снимка workflow карточки. set_status в любой из них
                сразу закрывает карточку; в этом режиме close, add_comment и set_card_field дают transition_not_allowed.
                Пустой массив — старая пилотная служба (ADR-017): close, add_comment и set_card_field работают как раньше.
            allowed_transitions:
              type: array
              items: { $ref: '#/components/schemas/ReactionStatus' }
              description: 'Статусы, разрешённые set_status из текущего reaction по снимку workflow этой карточки (item.workflow, срез 3); клиент строит кнопки по этому списку, а не по общему справочнику служб.'
            incoming_call:
              oneOf:
                - { $ref: '#/components/schemas/IncomingCall' }
                - { type: 'null' }
              description: 'Только dds_processing (ADR-031): доставленный phone_incoming, который ещё звонит — не принят и не старше 30 с по серверному времени. Иначе null.'
            actions: { type: array, items: { $ref: '#/components/schemas/Action' } }
            events: { type: array, items: { $ref: '#/components/schemas/DeliveredEvent' } }
            calls: { type: array, items: { $ref: '#/components/schemas/Call' } }
            comments: { type: array, items: { type: object, properties: { seq: { type: integer }, text: { type: string }, at: { type: string, format: date-time } } } }
            hints: { type: array, items: { type: string }, description: intro-режим }
            reference: { type: object, description: Только преподавателю }
            server_time: { type: string, format: date-time }

    Command:
      type: object
      additionalProperties: false
      required:
      - command_id
      - expected_seq
      - type
      - payload
      properties:
        command_id: &id001
          type: string
          format: uuid
        expected_seq:
          type: integer
          minimum: 0
        type:
          type: string
          enum:
          - open
          - close
          - set_status
          - add_comment
          - set_card_field
          - call_start
          - call_end
          - control_report
          - answer_incoming
          - end_incoming
          - save_intake_draft
          - dispatch_intake
          - complete_intake
          - mark_no_contact
          - mark_call_dropped
          - ask_intake_question
          - hold_incoming
          - resume_incoming
          - add_incident_type
          - remove_incident_type
          - review_service_selection
          - complete_profile_case
          - notify_services
          - send_caller_message
        payload:
          type: object
        client_at:
          type: string
          format: date-time
      oneOf:
      - properties:
          type:
            const: open
          payload:
            type: object
            additionalProperties: false
            required: []
            properties: {}
      - properties:
          type:
            const: close
          payload:
            type: object
            additionalProperties: false
            required: []
            properties: {}
        description: Явное закрытие после терминального статуса при обязательных комментариях и без активного звонка. set_status
          сам не закрывает; превышение норматива не закрывает. Пилотное исключение (ADR-017,
          срез 3) — close также разрешён из accepted для сценариев с reference.pilot_goal=accept_card;
          close_reason=pilot_completed. Для ДДС с непустым Item.terminal_statuses (ADR-030) close не используется
          (transition_not_allowed) — карточку закрывает сам финальный статус.
      - properties:
          type:
            const: set_status
          payload:
            type: object
            additionalProperties: false
            required:
            - status
            properties:
              status:
                $ref: '#/components/schemas/ReactionStatus'
              comment:
                type: string
        description: 'Статус реагирования своей службы с комментарием («карандаш»). Для ДДС с непустым
          Item.terminal_statuses (ADR-030) статус из этого списка сразу закрывает карточку
          (close_reason refused для refused, completed для completed/completed_without_team);
          при активном звонке или незавершённом обязательном звонке — отказ, как у close.'
      - properties:
          type:
            const: set_card_field
          payload:
            type: object
            additionalProperties: false
            required:
            - path
            - value
            properties:
              path:
                type: string
                const: /card/address/okrug
                description: 'Срез 3 (ADR-017): единственный разрешённый путь; не произвольный JSON Patch.'
              value:
                type: string
                minLength: 1
        description: 'Исправление одного разрешённого поля карточки (ADR-017, срез 3). Разрешена
          в reaction received/not_accepted; после accepted — transition_not_allowed. Правильность
          value не проверяется — эталон (reference.field_corrections) остаётся скрытым. ДДС с непустым
          Item.terminal_statuses (ADR-030): карточку не правит — transition_not_allowed.'
      - properties:
          type:
            const: add_comment
          payload:
            type: object
            additionalProperties: false
            required:
            - text
            properties:
              text:
                type: string
        description: 'Отдельный комментарий без статуса — только старые пилотные службы (ADR-017). ДДС с
          непустым Item.terminal_statuses (ADR-030): комментарий входит в set_status, add_comment даёт
          transition_not_allowed.'
      - properties:
          type:
            const: call_start
          payload:
            type: object
            additionalProperties: false
            required:
            - contact
            properties:
              contact:
                type: string
                minLength: 1
      - properties:
          type:
            const: call_end
          payload:
            type: object
            additionalProperties: false
            required:
            - call_id
            - accepted_by
            - summary
            - recording
            properties:
              call_id: *id001
              accepted_by:
                type: string
              summary:
                type: string
              recording:
                oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required:
                  - sha256
                  - size
                  - mime
                  properties:
                    sha256:
                      type: string
                      pattern: ^[0-9a-f]{64}$
                    size:
                      type: integer
                      minimum: 1
                      maximum: 10485760
                    mime:
                      enum:
                      - audio/webm
                      - audio/ogg
                      - audio/wav
        description: 'Завершение активного звонка. Для входящего звонка ДДС (ADR-031) поля присутствуют, но могут
          быть пустыми строками, а recording должен быть null. Для исходящего звонка ДДС на карточке с непустым
          Item.terminal_statuses (ДДС-3/ADR-032) accepted_by и summary тоже могут быть пустыми строками — журнал
          звонка dds/rubric-v2 не оценивает; на прежних пилотных службах и на исходящем звонке 112 оба поля
          по-прежнему обязаны быть непустыми, иначе invalid_payload.'
      - properties:
          type:
            const: control_report
          payload:
            type: object
            additionalProperties: false
            required:
            - text
            properties:
              text:
                type: string
                minLength: 1

      - properties:
          type: { const: answer_incoming }
          payload:
            type: object
            additionalProperties: false
            properties:
              event_key: { type: string, description: 'Только dds_processing (ADR-031): ключ доставленного события phone_incoming.' }
        description: 'operator112_intake — ответ на входящий вызов заявителя, тело пустое. dds_processing (ADR-031) —
          ответ на звонящий phone_incoming {event_key}: создаёт звонок direction=incoming; после 30 с от доставки —
          call_missed, при активном звонке — call_in_progress, повторный ответ — transition_not_allowed. Завершается call_end.'
      - properties:
          type: { const: end_incoming }
          payload: { type: object, additionalProperties: false }
      - properties:
          type: { const: ask_intake_question }
          payload:
            type: object
            additionalProperties: false
            required: [question_id]
            properties:
              question_id: { type: string }
      - properties:
          type: { const: hold_incoming }
          payload: { type: object, additionalProperties: false }
      - properties:
          type: { const: resume_incoming }
          payload: { type: object, additionalProperties: false }
      - properties:
          type: { const: save_intake_draft }
          payload:
            type: object
            additionalProperties: false
            required: [draft]
            properties:
              draft: { $ref: '#/components/schemas/Intake112Card' }
      - properties:
          type: { const: dispatch_intake }
          payload:
            type: object
            additionalProperties: false
            required: [service_code]
            properties:
              service_code: { type: string }
      - properties:
          type: { const: complete_intake }
          payload: { type: object, additionalProperties: false }
      - properties:
          type: { const: mark_no_contact }
          payload: { type: object, additionalProperties: false }
      - properties:
          type: { const: mark_call_dropped }
          payload: { type: object, additionalProperties: false }
      - properties:
          type: { const: add_incident_type }
          payload: { type: object, additionalProperties: false, required: [type_id], properties: { type_id: { type: string } } }
      - properties:
          type: { const: remove_incident_type }
          payload: { type: object, additionalProperties: false, required: [type_id], properties: { type_id: { type: string } } }
      - properties:
          type: { const: review_service_selection }
          payload: { type: object, additionalProperties: false, required: [services, reason], properties: { services: { type: array, items: { type: string }, uniqueItems: true }, reason: { type: string } } }
      - properties:
          type: { const: complete_profile_case }
          payload: { type: object, additionalProperties: false }
      - properties:
          type: { const: notify_services }
          payload: { type: object, additionalProperties: false, required: [services, reason], properties: { services: { type: array, items: { type: string }, minItems: 1, uniqueItems: true }, reason: { type: string } } }
        description: 'ADR-023: «Сохранить → оповестить и сохранить карточку» — единственный финал для card_only/full_case, назначенных с этого среза. Список не может быть пустым; reason обязателен, если он отличается от suggested_services. Закрывает черновик для дальнейших правок.'
      - properties:
          type: { const: send_caller_message }
          payload:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: { type: string, minLength: 1, maxLength: 500 }
        description: '112-5a/ADR-024: одно сообщение оператора заявителю в свободном тексте (intake_state.caller_mode=free_text). Принимается только при call_status=connected и отсутствии ожидающего хода; ответ заявителя формируется асинхронно worker и появляется в intake_state.caller_turns/transcript отдельным событием, не в этой квитанции.'

    Receipt:
      type: object
      required:
      - command_id
      - outcome
      - seq
      - reaction
      - item_state
      - server_at
      - replayed
      - action_id
      - log_seq
      properties:
        command_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum:
          - applied
          - rejected
        seq:
          type: integer
        reaction:
          $ref: '#/components/schemas/ReactionStatus'
        item_state:
          type: string
        server_at:
          type: string
          format: date-time
        deadlines:
          $ref: '#/components/schemas/Deadlines'
        call_id:
          type: string
          format: uuid
          nullable: true
          description: для call_start
        next_item_id:
          type: string
          format: uuid
          nullable: true
          description: после закрытия
        error_code:
          type: string
          nullable: true
        request_id:
          type: string
        replayed:
          type: boolean
          description: Повтор исходной квитанции с тем же HTTP/outcome; не новое действие
        action_id:
          type: string
          format: uuid
        log_seq:
          type: integer
          minimum: 1

    Action:
      type: object
      required:
      - id
      - seq
      - type
      - accepted
      - server_at
      - log_seq
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        accepted:
          type: boolean
        rejection:
          type: string
          nullable: true
        effect:
          type: object
          nullable: true
          description: 'Серверный факт изменённого состояния (например set_card_field: {path,old,new}), отдельно от клиентского payload — не участвует в request_digest (ADR-017, срез 3).'
        server_at:
          type: string
          format: date-time
        log_seq:
          type: integer
          minimum: 1

    IncomingCall:
      type: object
      required: [event_key, from, delivered_at, ring_until]
      properties:
        event_key: { type: string }
        from: { type: string, description: contact.key звонящего }
        delivered_at: { type: string, format: date-time }
        ring_until: { type: string, format: date-time, description: 'delivered_at + 30 с; позже ответ даёт call_missed.' }
    DeliveredEvent:
      type: object
      required: [key, delivery, text, delivered_at, late]
      properties:
        key: { type: string }
        delivery: { type: string, enum: [notice, phone_incoming, spawn_card] }
        from: { type: string }
        text: { type: string, description: 'Для phone_incoming ДДС (ADR-031) обучаемому пусто, пока звонок не принят (answered=false).' }
        answered: { type: boolean, description: 'Только phone_incoming ДДС: на звонок ответили (есть звонок с этим event_key).' }
        voice_url: { type: string, nullable: true }
        delivered_at: { type: string, format: date-time }
        late: { type: boolean }
    Call:
      type: object
      required:
      - id
      - contact_key
      - started_at
      properties:
        id:
          type: string
          format: uuid
        contact_key:
          type: string
        direction:
          type: string
          enum: [outgoing, incoming]
          description: 'ADR-031: incoming — ответ на phone_incoming; обязательный звонок засчитывается только outgoing.'
        event_key:
          type: [string, 'null']
          description: 'ADR-031: событие phone_incoming, на которое ответили; null для исходящего.'
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        accepted_by:
          type: string
          nullable: true
          description: «Кто принял»
        summary:
          type: string
          nullable: true
          description: «Суть сообщения»
        has_recording:
          type: boolean
        stt_state:
          type: string
          enum:
          - pending
          - ready
          - failed
          - missing
        transcript:
          type: string
          nullable: true
          description: Только преподавателю и после оценки — обучаемому; текст из assessment_inputs, до seal — из удерживаемого
            STT tasks.result. Нет изменяемого transcript в calls.
        recording_sha256:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        recording_upload_deadline_at:
          type:
          - string
          - 'null'
          format: date-time
        recording_state:
          enum:
          - absent
          - awaiting
          - ready
          - expired

    LessonAssessmentRow:
      type: object
      required:
      - item_id
      - user
      - workstation_no
      - ordinal
      - card_number
      - item_state
      - close_reason
      - closed_at
      - automatic_state
      - final
      properties:
        item_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        workstation_no:
          type: integer
        ordinal:
          type: integer
        card_number:
          type: string
        item_state:
          type: string
          enum: [closed, interrupted]
        close_reason:
          type: string
          nullable: true
        closed_at:
          type: string
          format: date-time
        automatic_state:
          type: [string, 'null']
          enum: [waiting, pending, leased, done, failed, dead_letter, cancelled, null]
        final:
          type: object
          nullable: true
          description: Итоговая ревизия (последняя expert, иначе auto), если уже есть.
          properties:
            revision: { type: integer }
            kind: { type: string, enum: [auto, expert] }
            status: { type: string, enum: [ready, needs_review, unavailable] }
            score: { type: [number, 'null'] }
            passed: { type: [boolean, 'null'] }

    Assessment:
      type: object
      required:
      - id
      - item_id
      - revision
      - kind
      - status
      - rubric_version
      - criteria
      - critical_errors
      - created_at
      - input_id
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        revision:
          type: integer
        kind:
          type: string
          enum:
          - auto
          - expert
        status:
          type: string
          enum:
          - ready
          - needs_review
          - unavailable
        rubric_version:
          type: string
        rubric_effective:
          type: object
          additionalProperties: true
          description: Слитая рубрика кейса (ADR-013)
        score:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
          description: Число только для ready; needs_review/unavailable — null без перенормировки unavailable.
        passed:
          type:
          - boolean
          - 'null'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/CriterionResult'
        critical_errors:
          type: array
          items:
            type: string
        feedback:
          type: array
          items:
            type: object
            properties:
              criterion_id:
                type: string
              severity:
                type: string
                enum:
                - info
                - warning
                - critical
              text:
                type: string
              guide_ref:
                type: string
        model:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        input_id:
          type:
          - string
          - 'null'
          format: uuid
          description: У expert без автооценки может отсутствовать; основание — evidence и rubric_effective.
        base_revision:
          type:
          - integer
          - 'null'
      allOf:
      - if:
          properties:
            status:
              const: ready
          required:
          - status
        then:
          required:
          - score
          - passed
          properties:
            score:
              type: number
            passed:
              type: boolean
        else:
          required:
          - score
          - passed
          properties:
            score:
              type: 'null'
            passed:
              type: 'null'

    CriterionResult:
      type: object
      required:
      - id
      - status
      - weight
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - met
          - partial
          - not_met
          - not_applicable
          - unavailable
        score:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        weight:
          type: number
        critical:
          type: boolean
        evidence_refs:
          type: array
          items:
            type: string
          description: action:<action_id> | event:<key> | call:<id> | text:<field>:<from>-<to> | line:<id>
        explanation:
          type: string
        penalty_points:
          type: number
          minimum: 0
          nullable: true
          description: 112-6/ADR-026 — только для kind=penalty критериев; фактически начисленные штрафные баллы (0, если эталон отсутствует или нарушений нет).
        details:
          type: array
          description: 112-6/ADR-026 — построчная детализация блока/штрафа (поле адреса, карта, служба, ...), для разбора преподавателем.
          items:
            $ref: '#/components/schemas/CriterionDetail'

    CriterionDetail:
      type: object
      required:
      - key
      - status
      properties:
        key:
          type: string
        label:
          type: string
        points:
          type: number
        max_points:
          type: number
        status:
          type: string
          enum: [met, partial, not_met, not_applicable, unavailable]
          description: 'unavailable (ADR-028) — одна судейская проверка вопроса вернула needs_review или не получила ответа; сам критерий тогда needs_review целиком.'
        actual:
          type: string
          nullable: true
        expected:
          type: string
          nullable: true
        errors:
          type: array
          description: 'ДДС-4/ADR-034 — только у строк G_GRAMMAR: найденные в комментарии ошибки. Это не эталон, обучаемый видит их в своём результате.'
          items:
            $ref: '#/components/schemas/GrammarError'

    GrammarError:
      type: object
      required: [fragment, correction, kind]
      properties:
        fragment:
          type: string
          description: Фрагмент комментария обучаемого с ошибкой (подстрока его текста).
        correction:
          type: string
        kind:
          type: string
          enum: [spelling, grammar, punctuation]

    AssessmentRevision:
      type: object
      required:
      - reason
      - criteria
      - base_revision
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 2000
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/CriterionResult'
          description: При base_revision=0 полный набор применимых критериев обязателен; иначе допускаются поправки, остальные
            копируются из текущей ревизии. Все unavailable должны быть разрешены преподавателем.
        score_override:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        base_revision:
          type: integer
          minimum: 0
          description: Текущая итоговая ревизия или 0 при отсутствии оценки; первая expert тогда revision=2 (номер 1 зарезервирован
            auto).

    ItemResult:
      type: object
      required: [item_id, lesson_id, lesson_title, card_number, item_state, assessment_status, errors]
      properties:
        item_id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        lesson_title:
          type: string
        card_number:
          type: string
        difficulty:
          type: integer
        closed_at:
          type: string
          format: date-time
        total_seconds:
          type: number
        score:
          type: number
          nullable: true
        passed:
          type: boolean
          nullable: true
        critical_errors:
          type: array
          items:
            type: string
        assessment_status:
          type: string
          enum: [ready, needs_review, unavailable, pending, not_assessed]
        assessment_kind:
          type: [string, 'null']
          enum: [auto, expert, null]
        item_state:
          type: string
          enum: [closed, interrupted]
        card_status:
          type: string
          enum: [registered, not_notified, in_progress, refused, completed, not_completed]
          description: >-
            ДДС-3/ADR-032: только dds_processing, отсутствует для operator112_intake. То же вычисление, что и
            ItemSummary.card_status (ADR-030), упрощённое для уже закрытой/прерванной карточки отчёта: без сравнения
            с текущим временем, поэтому not_notified здесь не используется — отсутствие первичного решения
            отражается как registered.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PublicError'
        work_seconds:
          type:
          - number
          - 'null'
          description: Активное время от primary_at; total_seconds — от offered_at
        level_at_start:
          $ref: '#/components/schemas/Level'
        interruptions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - recovery_id
            - cause
            - detected_at
            properties:
              recovery_id:
                type: string
                format: uuid
              cause:
                const: server_restart
              detected_at:
                type: string
                format: date-time

    Progress:
      type: object
      required: [user_id, level, items_total, completed_items, pending_assessments, avg_score, by_lesson, error_frequency]
      properties:
        user_id: { type: string, format: uuid }
        level: { $ref: '#/components/schemas/Level' }
        items_total: { type: integer }
        completed_items: { type: integer }
        pending_assessments: { type: integer }
        avg_score: { type: [number, 'null'] }
        by_lesson:
          type: array
          items:
            type: object
            required: [lesson_id, title, date, avg_score, items]
            properties:
              lesson_id: { type: string, format: uuid }
              title: { type: string }
              date: { type: string, format: date-time }
              avg_score: { type: [number, 'null'] }
              items: { type: integer }
        error_frequency:
          type: array
          items:
            type: object
            required: [criterion_id, count]
            properties:
              criterion_id: { type: string }
              count: { type: integer }
    Recommendation:
      type: object
      required:
      - current_level
      - recommended_level
      - policy_version
      - computed_at
      - id
      - basis_version
      properties:
        current_level:
          $ref: '#/components/schemas/Level'
        recommended_level:
          $ref: '#/components/schemas/Level'
        basis:
          type: object
          additionalProperties: true
          description: Конкретные итоговые assessment_id/revision и уровень прохождения; выдаётся только актуальная
            basis_version
        policy_version:
          type: string
        computed_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
          nullable: true
        id:
          type: string
          format: uuid
        basis_version:
          type: integer
          minimum: 0

    LessonReport:
      type: object
      required: [lesson, items, participants, aggregates]
      properties:
        lesson:
          $ref: '#/components/schemas/ReportLesson'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportItem'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ReportParticipant'
        aggregates:
          type: object
          properties:
            avg_score:
              type: [number, 'null']
            ready_assessments: { type: integer }
            pending_assessments: { type: integer }
            interrupted_items: { type: integer }
            score_histogram:
              type: array
              items:
                type: object
                properties:
                  bucket:
                    type: string
                  count:
                    type: integer
            top_errors:
              type: array
              items:
                type: object
                properties:
                  criterion_id:
                    type: string
                  count:
                    type: integer

    ReportLesson:
      type: object
      required: [id, title, mode, finished_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        mode: { type: string, enum: [intro, training, preview] }
        finished_at: { type: string, format: date-time }

    PublicError:
      type: object
      required: [criterion_id, status, label]
      properties:
        criterion_id: { type: string }
        status: { type: string, enum: [partial, not_met] }
        label: { type: string }
        guide_ref: { type: [string, 'null'] }

    ReportItem:
      allOf:
      - $ref: '#/components/schemas/ItemResult'
      - type: object
        required: [full_name, workstation_no, scenario_title, ordinal, level]
        properties:
          full_name: { type: string }
          workstation_no: { type: integer }
          scenario_title: { type: string }
          ordinal: { type: integer }
          level: { $ref: '#/components/schemas/Level' }
          assessment_id: { type: [string, 'null'], format: uuid }
          assessment_revision: { type: [integer, 'null'] }
          intake_blocks:
            type: array
            items: { $ref: '#/components/schemas/IntakeBlockScore' }
          intake_penalty_total: { type: [number, 'null'] }
          comment_errors:
            type: [integer, 'null']
            description: 'ДДС-4/ADR-034 — число орфографических, грамматических и пунктуационных ошибок в комментариях обучаемого (G_GRAMMAR, dds/rubric-v3); null, если критерий не оценивался.'

    IntakeBlockScore:
      type: object
      required: [criterion_id, label, max_points]
      properties:
        criterion_id: { type: string }
        label: { type: string }
        points: { type: [number, 'null'] }
        max_points: { type: number }

    ReportParticipant:
      type: object
      required: [user_id, full_name, workstation_no, level, items, ready_assessments, pending_assessments, interrupted_items]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        workstation_no: { type: integer }
        level: { $ref: '#/components/schemas/Level' }
        items: { type: integer }
        ready_assessments: { type: integer }
        pending_assessments: { type: integer }
        interrupted_items: { type: integer }
        avg_score: { type: [number, 'null'] }
        avg_open_seconds: { type: [number, 'null'] }
        avg_work_seconds: { type: [number, 'null'] }
        avg_total_seconds: { type: [number, 'null'] }

    ReportFile:
      type: object
      required: [id, lesson_id, task_id, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        lesson_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, building, ready, failed] }
        requested_at: { type: string, format: date-time }
        generated_at: { type: [string, 'null'], format: date-time }
        download_url: { type: [string, 'null'] }

    GroupProgress:
      type: object
      properties:
        users: { type: array, items: { type: object, properties: { user: { $ref: '#/components/schemas/User' }, avg_score: { type: number }, trend: { type: number }, items: { type: integer } } } }
        leaders: { type: array, items: { type: string, format: uuid } }
        lagging: { type: array, items: { type: string, format: uuid } }
        top_errors: { type: array, items: { type: object, properties: { criterion_id: { type: string }, count: { type: integer } } } }

    AdminStatus:
      type: object
      required: [server_time, db_schema_version, expected_schema_version, tasks, models, disk_free_bytes, last_backup_at, backup, workers, failed_tasks]
      properties:
        server_time: { type: string, format: date-time }
        db_schema_version: { type: integer }
        expected_schema_version: { type: integer, description: Версия схемы, которую ждёт эта сборка }
        tasks: { type: object, additionalProperties: { type: object, additionalProperties: { type: integer } }, description: kind → status → count }
        models:
          type: object
          description: llm — по последней проверке worker'а (null, если модель не используется); stt/tts пока всегда null
          properties:
            llm: { $ref: '#/components/schemas/AdminModelStatus' }
            stt: { $ref: '#/components/schemas/AdminModelStatus' }
            tts: { $ref: '#/components/schemas/AdminModelStatus' }
        disk_free_bytes: { type: [integer, 'null'], description: Свободно на диске блобов (BLOB_ROOT api) }
        last_backup_at: { type: [string, 'null'], format: date-time }
        backup: { $ref: '#/components/schemas/AdminBackupStatus' }
        workers:
          type: array
          items:
            type: object
            required: [id, checked_at]
            properties:
              id: { type: string }
              role: { type: string }
              checked_at: { type: string, format: date-time }
        failed_tasks: { type: array, items: { $ref: '#/components/schemas/AdminTaskSummary' }, description: failed/dead_letter, до 50 последних }
    AdminModelStatus:
      type: [object, 'null']
      required: [status, checked_at]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        model: { type: string }
        checked_at: { type: string, format: date-time }
    AdminBackupStatus:
      type: object
      required: [enabled, free_bytes, checked_at, last_backup_at, copies, runs]
      properties:
        enabled: { type: boolean, description: Worker сообщил о каталоге копий (BACKUP_DIR задан) }
        free_bytes: { type: [integer, 'null'] }
        checked_at: { type: [string, 'null'], format: date-time }
        last_backup_at: { type: [string, 'null'], format: date-time }
        copies:
          type: array
          items:
            type: object
            required: [name, created_at, size_bytes]
            properties:
              name: { type: string }
              created_at: { type: string, format: date-time }
              size_bytes: { type: integer }
        runs: { type: array, items: { $ref: '#/components/schemas/AdminTaskSummary' }, description: Последние 10 задач backup.run }
    AdminTaskSummary:
      type: object
      required: [id, kind, status, attempts, max_attempts, last_error_code, created_at, terminal_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status: { type: string, enum: [waiting, pending, leased, done, failed, dead_letter, cancelled] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        last_error_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        terminal_at: { type: [string, 'null'], format: date-time }
    Task:
      type: object
      required:
      - id
      - kind
      - status
      - attempts
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        scope_type:
          type: string
        scope_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - waiting
          - pending
          - leased
          - done
          - failed
          - dead_letter
          - cancelled
        attempts:
          type: integer
        max_attempts:
          type: integer
        last_error_code:
          type: string
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        terminal_at:
          type: string
          format: date-time
          nullable: true
        wait_until:
          type:
          - string
          - 'null'
          format: date-time
          description: Следующая проверка coordinator; не общий deadline очереди STT.
        wait_reason:
          type:
          - string
          - 'null'
        priority:
          type: integer
          minimum: 0
        dependency_task_ids:
          type: array
          items:
            type: string
            format: uuid
